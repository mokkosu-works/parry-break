<script>
  'use strict';
  // =====================================================================
  //  RICOCHET OVERDRIVE  — design.md に基づく実装 + v2 拡張
  //  v2: 崩落(要石) / 爆薬の誘爆 / JUST パリィ(ブレイカー) / グレイズ /
  //      跳弾ボーナス / OVERDRIVE 分身弾 / ボスのレーザー / 難易度上昇
  // =====================================================================

  // ---- 定数 -----------------------------------------------------------
  const H = 720, W = 1200, DT = 1 / 60, DEG = Math.PI / 180;
  const TOP_Y = 56;                       // 上壁 (HUD 下端)
  const PADDLE_Y = 670, PADDLE_H = 14, PADDLE_BASE_W = 120, PADDLE_SPEED = 900;
  const WARN_Y = PADDLE_Y - 120;          // 警告ライン: パドルの上 120px
  const BR = 8;                           // ボール半径
  const GX0 = (W - 840) / 2, CW = 60, CH = 24, GY0 = 84;  // 14 列グリッド, 60x24 ブロック
  const PARRY_WIN = 0.10, PERFECT_WIN = 0.03, JUST_WIN = 0.012, PARRY_CD = 0.35, STUN = 0.8;
  const INPUT_LAG = 0.016;   // 表示遅延の補正: 画面は約1フレーム遅れて見えるため、入力を少し早めて扱う
  const STAGE_MIN = [0, 100, 250, 450];
  const STAGE_MULT = [1, 2, 4, 8, 16];
  const STAGE_SPD = [1, 495 / 420, 585 / 420, 690 / 420];
  const DECAY = [0, 8, 14, 22];           // ヒート減衰/秒 (段階が高いほど維持が難しい)
  const OD_HEAT = 700, OD_TIME = 10, OD_MAX = 20, MAX_SPEED = 1400;
  const OD_MAX_SPEED = 1000;
  const MIN_ANGLE = 15 * DEG;
  const GRAZE_DIST = 22;
  const BLAST_R = 84, BREAKER_R = 120, PHANTOM_MAX = 6;
  const PTS = { T: 400, R: 200, M: 200, S: 250, s: 80, X: 350, '#': 500, K: 500, B: 300 };
  const HP = { N: 1, T: 2, R: 3, M: 3, S: 1, s: 1, X: 1, '#': 1, K: 3, B: 1 };
  const CLEARABLE = new Set(['N', 'T', 'R', 'M', 'S', 's', 'K', 'B']);
  const THRU = new Set(['N', 'T', 'S', 's', 'K', 'B']);   // 貫通弾が貫ける
  const COL = {
    N0: '#3ee0ff', N1: '#a66bff', N2: '#ffd84d',
    T: '#ff3d5a', R: '#3dff9b', M: '#4d84ff', S: '#ff5ec8', s: '#ff9ee0',
    X: '#d8e4f0', '#': '#55556a', C: '#ffde3d', K: '#ffffff', B: '#ff7a1a',
  };

  const cv = document.getElementById('c');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // ---- ユーティリティ -------------------------------------------------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rand = (a, b) => a + Math.random() * (b - a);
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function circleRect(cx, cy, r, x, y, w, h) {
    const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }
  function rectDist(px, py, x, y, w, h) {
    return Math.hypot(px - clamp(px, x, x + w), py - clamp(py, y, y + h));
  }
  const fmt = n => Math.floor(n).toLocaleString('en-US');
  const storage = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // =====================================================================
  //  オーディオ (WebAudio 合成)
  // =====================================================================
  const AU = { ctx: null, last: {} };
  function auInit() {
    if (AU.ctx) { if (AU.ctx.state === 'suspended' && !G.paused) AU.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      const c = new C();
      AU.ctx = c;
      AU.master = c.createGain(); AU.master.gain.value = 0.55; AU.master.connect(c.destination);
      AU.sfx = c.createGain(); AU.sfx.gain.value = 0.9; AU.sfx.connect(AU.master);
      AU.music = c.createGain(); AU.music.gain.value = 0; AU.music.connect(AU.master);
      const len = c.sampleRate;
      AU.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = AU.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AU.ctx = null; }
  }
  function tone(f, d, type = 'square', v = 0.2, f2 = 0, when = 0, dest) {
    const c = AU.ctx; if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || AU.sfx); o.start(t); o.stop(t + d + 0.02);
  }
  function noise(d, v, freq = 2000, when = 0, dest, ftype = 'bandpass') {
    const c = AU.ctx; if (!c) return;
    const t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = AU.noiseBuf;
    const f = c.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(dest || AU.sfx); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
  }
  function throttle(key, gap) {
    const c = AU.ctx; if (!c) return false;
    if (c.currentTime - (AU.last[key] || 0) < gap) return false;
    AU.last[key] = c.currentTime; return true;
  }
  const PENTA = [0, 2, 4, 7, 9];
  const SFX = {
    wall() { if (throttle('wall', 0.03)) tone(520, 0.04, 'square', 0.04); },
    paddle() { tone(392, 0.07, 'square', 0.08, 300); },
    hit() { if (throttle('hit', 0.025)) tone(740, 0.05, 'square', 0.06, 620); },
    clink() { if (throttle('clink', 0.04)) tone(2200, 0.06, 'triangle', 0.06, 1800); },
    brk(p) { if (throttle('brk', 0.022)) { noise(0.09, 0.16, 2600 + p * 400); tone(900 + p * 120, 0.07, 'triangle', 0.07, 450); } },
    perfect() { tone(1320, 0.18, 'sawtooth', 0.1, 2640); tone(1980, 0.22, 'square', 0.06); noise(0.12, 0.2, 6000); tone(80, 0.15, 'sine', 0.35, 40); },
    just() {
      tone(1760, 0.28, 'sawtooth', 0.1, 3520); tone(2637, 0.32, 'square', 0.05); tone(1319, 0.32, 'square', 0.05);
      noise(0.2, 0.3, 8000, 0, null, 'highpass'); tone(70, 0.3, 'sine', 0.5, 30);
    },
    good() { tone(990, 0.12, 'square', 0.09, 1480); noise(0.06, 0.1, 4000); },
    miss() { tone(220, 0.09, 'triangle', 0.08, 150); },
    fire() { if (throttle('fire', 0.03)) tone(330, 0.09, 'sawtooth', 0.035, 170); },
    hurt() { tone(140, 0.4, 'sawtooth', 0.22, 40); noise(0.35, 0.35, 700); },
    od() { tone(220, 0.9, 'sawtooth', 0.14, 1760); tone(330, 0.9, 'square', 0.06, 2640); noise(0.6, 0.2, 5000, 0, null, 'highpass'); },
    odEnd() { tone(880, 0.5, 'sawtooth', 0.08, 220); },
    core() { tone(160, 0.25, 'square', 0.18, 70); noise(0.2, 0.25, 1200); },
    coreDie() { tone(90, 0.9, 'sawtooth', 0.25, 30); noise(0.9, 0.45, 500); },
    mirror() { tone(1760, 0.1, 'triangle', 0.08, 2600); },
    clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, 'square', 0.07, 0, i * 0.07)); },
    phase() { tone(110, 0.7, 'sawtooth', 0.2, 55); tone(117, 0.7, 'sawtooth', 0.2, 58); },
    alarm() { for (let i = 0; i < 3; i++) { tone(880, 0.18, 'square', 0.07, 0, i * 0.3); tone(660, 0.12, 'square', 0.07, 0, i * 0.3 + 0.15); } },
    over() { noise(1.0, 0.5, 300, 0, null, 'lowpass'); tone(70, 1.0, 'sine', 0.45, 25); },
    count() { tone(660, 0.08, 'square', 0.06); },
    launch() { tone(520, 0.1, 'square', 0.07, 1040); },
    // 崩落: ブロックが落ちるたびに音階が上がっていく
    note(i) {
      if (!throttle('note', 0.018)) return;
      const s = PENTA[i % 5] + 12 * Math.min(3, Math.floor(i / 5));
      const f = 330 * Math.pow(2, s / 12);
      tone(f, 0.16, 'triangle', 0.08); tone(f * 2, 0.07, 'square', 0.02);
    },
    crumble() { if (throttle('crumble', 0.1)) { noise(0.6, 0.3, 220, 0, null, 'lowpass'); tone(60, 0.5, 'sine', 0.3, 35); } },
    keystone() { tone(523, 0.35, 'triangle', 0.12, 262); tone(784, 0.35, 'triangle', 0.08, 392); },
    blast() { if (throttle('blast', 0.05)) { noise(0.5, 0.45, 600, 0, null, 'lowpass'); tone(110, 0.35, 'sawtooth', 0.16, 30); } },
    breaker() { noise(0.8, 0.55, 400, 0, null, 'lowpass'); tone(55, 0.8, 'sine', 0.55, 25); tone(880, 0.4, 'sawtooth', 0.08, 110); },
    graze() { if (throttle('graze', 0.04)) tone(3200, 0.03, 'square', 0.03); },
    ricochet() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.05, 0, i * 0.04)); },
    phantom() { tone(1400, 0.15, 'sine', 0.06, 2800); },
    laserWarn() { for (let i = 0; i < 3; i++) tone(1200, 0.1, 'square', 0.05, 0, i * 0.25); },
    laser() { noise(0.4, 0.3, 3000); tone(90, 0.4, 'sawtooth', 0.2, 60); },
  };

  // ---- BGM: 16 ステップのシーケンサ。ヒート段階でレイヤーとキーが上がる ----
  const MUS = { on: false, next: 0, step: 0, timer: null };
  function musicStart() {
    if (!AU.ctx) return;
    MUS.on = true; MUS.next = AU.ctx.currentTime + 0.06; MUS.step = 0;
    const g = AU.music.gain; g.cancelScheduledValues(0); g.setValueAtTime(0.32, AU.ctx.currentTime);
    if (!MUS.timer) MUS.timer = setInterval(musicTick, 25);
  }
  function musicCut() {   // ミス時: 音が即座に途切れる (コアピラー4)
    MUS.on = false;
    if (AU.ctx) { const g = AU.music.gain; g.cancelScheduledValues(0); g.setValueAtTime(0, AU.ctx.currentTime); }
  }
  function musicDuck() {
    if (!AU.ctx || !MUS.on) return;
    const g = AU.music.gain, t = AU.ctx.currentTime;
    g.cancelScheduledValues(0); g.setValueAtTime(0, t); g.linearRampToValueAtTime(0.32, t + 0.9);
  }
  const BASS_PROG = [0, 0, -4, -2];
  const LEAD = [12, 15, 19, 15, 12, 10, 7, 10, 12, 15, 17, 19, 22, 19, 17, 15];
  function musicTick() {
    if (!MUS.on || !AU.ctx || G.paused) return;
    const c = AU.ctx;
    while (MUS.next < c.currentTime + 0.12) {
      const I = G.od ? 4 : stage();
      const bpm = [132, 136, 142, 150, 168][I];
      const sp = 60 / bpm / 4;
      const t = MUS.next - c.currentTime;
      const s = MUS.step % 16, bar = Math.floor(MUS.step / 16) % 4;
      const tr = I === 4 ? 5 : I >= 3 ? 2 : 0;
      const root = BASS_PROG[bar] + tr;
      const nf = semi => 110 * Math.pow(2, semi / 12);
      const M = AU.music;
      if (s % 4 === 0 || (I === 4 && s === 14)) tone(150, 0.16, 'sine', 0.55, 40, t, M);
      if (I >= 1 && s % 4 === 2) noise(0.05, 0.12, 9000, t, M, 'highpass');
      if (I >= 3 && s % 2 === 1) noise(0.025, 0.05, 11000, t, M, 'highpass');
      if (I >= 2 && (s === 4 || s === 12)) noise(0.12, 0.18, 1800, t, M);
      if (s % 2 === 0) tone(nf(root - 12 + (s % 8 === 6 ? 12 : 0)), sp * 1.8, 'sawtooth', 0.1, 0, t, M);
      if (I >= 2) {
        const ch = [0, 3, 7, 12, 15, 12, 7, 3];
        tone(nf(root + 12 + ch[s % 8]), sp * 0.9, 'square', 0.025, 0, t, M);
      }
      if (I >= 3 && s % 2 === 0) {
        const n = LEAD[(s + bar * 4) % 16];
        tone(nf(root + 12 + n), sp * 1.9, I === 4 ? 'sawtooth' : 'triangle', 0.05, 0, t, M);
      }
      MUS.next += sp; MUS.step++;
    }
  }

  // =====================================================================
  //  ウェーブ定義
  // =====================================================================
  const HAND = {   // 新ギミックの初登場ウェーブ: そのギミックだけの安全な配置
    1: ['..NNNNNNNNNN..',
        '.NNNNNNNNNNNN.',
        '.NNNNNNNNNNNN.',
        '..NNNNNNNNNN..',
        '....NNNNNN....'],
    2: ['...K......K...',
        '...N......N...',
        '.NNNNN..NNNNN.',
        '.NNNNN..NNNNN.',
        '..NNN....NNN..'],
    4: ['...T......T...',
        'NNNNNNNNNNNNNN',
        '.NNNNNNNNNNNN.',
        '..NNNN..NNNN..'],
    6: ['NNNNNNNNNNNNNN',
        'NNNBNNNNNNBNNN',
        'NNNNNNBBNNNNNN',
        'NNBNNNNNNNNBNN',
        '.NNNNNNNNNNNN.'],
    8: ['RR....NN....RR',
        'NNNNNNNNNNNNNN',
        '..NNNRNNRNNN..',
        '..NNNNNNNNNN..'],
    14: ['NNNNNNNNNNNNNN',
         'NNN..M..M..NNN',
         'NNN........NNN',
         'NNNNN....NNNNN'],
    20: ['..SSSSSSSSSS..',
         'NNNNNNNNNNNNNN',
         '.N.N.N..N.N.N.'],
    26: ['...T......T...',
         '..XXX....XXX..',
         'NNNNNNNNNNNNNN',
         '.NNNNNNNNNNNN.',
         '..NNNNNNNNNN..'],
  };
  function unlockedTypes(b) {
    const t = ['N'];
    if (b >= 2) t.push('K'); if (b >= 4) t.push('T'); if (b >= 6) t.push('B');
    if (b >= 8) t.push('R'); if (b >= 14) t.push('M'); if (b >= 20) t.push('S'); if (b >= 26) t.push('X');
    return t;
  }
  // 固定シードによる決定的な配置生成 (毎回同じ配置 = 覚えて攻略できる)
  function genLayout(b) {
    if (HAND[b]) return HAND[b];
    const rng = mulberry32(b * 7919 + 3);
    const types = unlockedTypes(b);
    const cellTypes = types.filter(t => t !== 'K');
    const newest = cellTypes[cellTypes.length - 1];
    const combo = b % 2 === 0;    // 偶数: 組み合わせウェーブ / 奇数: 最新ギミックの学習寄り
    const rows = Math.min(8, 4 + Math.floor(b / 7));
    const shapes = ['full', 'checker', 'diamond', 'pillars', 'vee', 'holes', 'ladder'];
    const shape = shapes[Math.floor(rng() * shapes.length)];
    const mask = (r, c) => {
      switch (shape) {
        case 'checker': return (r + c) % 2 === 0 || r === 0;
        case 'diamond': return (6 - c) + Math.abs(r - (rows - 1) / 2) * 1.6 <= 6.8;
        case 'pillars': return c % 3 !== 2 || r === 0;
        case 'vee': return c >= r * 0.8 - 0.5;
        case 'holes': return rng() < 0.74;
        case 'ladder': return r % 3 !== 1 || c % 2 === 0;
        default: return true;
      }
    };
    const grid = Array.from({ length: rows }, () => Array(14).fill('.'));
    const caps = { T: Math.min(3, 1 + Math.floor(b / 15)), M: 2, X: 3, B: 2 + Math.floor(b / 15), '#': 2 };
    const cnt = { T: 0, M: 0, X: 0, B: 0, '#': 0 };
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < 7; c++) {
        if (!mask(r, c)) continue;
        const w = { N: 1 };
        if (cellTypes.includes('T')) w.T = r <= 1 ? 0.12 : 0.03;
        if (cellTypes.includes('B')) w.B = 0.07;
        if (cellTypes.includes('R')) w.R = 0.09;
        if (cellTypes.includes('M')) w.M = 0.045;
        if (cellTypes.includes('S')) w.S = r >= rows - 2 ? 0.05 : 0.1;
        if (cellTypes.includes('X')) w.X = r >= 1 ? 0.07 : 0.02;
        if (!combo && newest !== 'N') {
          for (const k in w) if (k !== 'N') w[k] *= (k === newest ? 2.2 : 0.5);
        }
        for (const k in cnt) if (cnt[k] >= caps[k] && w[k]) w[k] = 0;
        let tot = 0; for (const k in w) tot += w[k];
        let x = rng() * tot, pick = 'N';
        for (const k in w) { x -= w[k]; if (x <= 0) { pick = k; break; } }
        if (b >= 12 && r > 0 && cnt['#'] < caps['#'] && rng() < 0.05) pick = '#';
        if (pick in cnt) cnt[pick]++;
        grid[r][c] = pick; grid[r][13 - c] = pick;
      }
    }
    if (types.includes('K')) placeKeystones(grid, rng);
    let n = 0; for (const row of grid) for (const ch of row) if (CLEARABLE.has(ch)) n++;
    if (n < 14) grid[0] = Array(14).fill('N');
    return grid.map(r => r.join(''));
  }
  // 塊ごとに最上段へ要石を置く (左右対称)。要石を失った塊は崩落する
  function placeKeystones(grid, rng) {
    const R = grid.length;
    const seen = grid.map(r => r.map(() => false));
    const structural = ch => ch !== '.' && ch !== '#';
    for (let r = 0; r < R; r++) for (let c = 0; c < 14; c++) {
      if (seen[r][c] || !structural(grid[r][c])) continue;
      const cells = [], q = [[r, c]];
      seen[r][c] = true;
      while (q.length) {
        const [y, x] = q.pop(); cells.push([y, x]);
        for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const ny = y + dy, nx = x + dx;
          if (ny < 0 || ny >= R || nx < 0 || nx >= 14 || seen[ny][nx] || !structural(grid[ny][nx])) continue;
          seen[ny][nx] = true; q.push([ny, nx]);
        }
      }
      if (cells.length < 5) continue;
      if (!cells.some(([, x]) => x <= 6)) continue;            // 右側だけの塊は左の鏡像で処理済み
      if (cells.some(([y, x]) => grid[y][x] === 'K')) continue;
      const left = cells.filter(([, x]) => x <= 6);
      const top = Math.min(...left.map(([y]) => y));
      const cand = left.filter(([y]) => y === top).sort((a, b) => a[1] - b[1]);
      const picks = cells.length >= 36 && cand.length > 1
        ? [cand[0], cand[cand.length - 1]]
        : [cand[Math.floor(rng() * cand.length)]];
      for (const [y, x] of picks) { grid[y][x] = 'K'; grid[y][13 - x] = 'K'; }
    }
  }

  // ボス要塞 ('C' = コア、2行分の高さ)
  const BOSS_T = [
    ['#T#####T#',

  ];
  const BOSS_CORE_HP = [8, 6, 6, 7, 8, 9];   // コアごとの HP (合計 8 / 12 / 18 / 21 / 24 / 27)
  const BOSS_TIME = [90, 90, 85, 85, 85, 85];

  // =====================================================================
  //  ゲーム状態
  // =====================================================================
  const IN = { mouseX: W / 2, useMouse: false, padX: 0, actions: [], keys: {}, pa: false, prt: false, pst: false };
  const SYNC = { wall: 0, sim: 0, scale: 1 };   // 入力の時刻をシミュレーション時刻へ変換する
  let G = {
    mode: 'title', paused: false, t: 0, best: storage.get('ro_best', 0), bestWave: storage.get('ro_bestwave', 0),
    od: false, heat: 0, score: 0, dispScore: 0, blocks: [], bullets: [], particles: [], popups: [], debris: [],
    rings: [], callouts: [], blasts: [], lasers: [], phantoms: [], form: { ox: 0, oy: 0 },
    paddle: { x: W / 2, vx: 0, stun: 0 }, ball: null, shake: 0, flash: 0, titleT: 0, hitstop: 0, slowmo: 0,
  };

  function stage() { const h = G.heat; return h >= 450 ? 3 : h >= 250 ? 2 : h >= 100 ? 1 : 0; }
  function mult() { return G.od ? 16 : STAGE_MULT[stage()]; }
  function baseSpeed() {
    const b = G.base;
    const s = b <= 10 ? 420 : b <= 20 ? 480 : b < 30 ? 540 : 600 + (b - 30) * 4;
    return s * G.lm;
  }
  function targetSpeed() {
    const s = baseSpeed();
    if (G.od) {
      const s4 = Math.min(900, s * STAGE_SPD[3]);
      return s4 + (OD_MAX_SPEED - s4) * Math.min(1, G.odElapsed / OD_TIME);
    }
    return Math.min(MAX_SPEED, s * STAGE_SPD[stage()]);
  }
  const descentSpeed = () => Math.min(13, 4.5 + 0.18 * (G.base - 1)) * G.lm;
  const turretInterval = () => Math.max(1.2, 2.8 - 0.04 * G.base) / G.lm;
  const bulletSpeed = () => Math.min(560, 300 + 4 * (G.base - 1)) * G.lm;

  function newGame() {
    auInit();
    Object.assign(G, {
      mode: 'play', paused: false, score: 0, dispScore: 0, heat: 0, od: false, odTime: 0, odElapsed: 0,
      streak: 0, maxStreak: 0, paddle: { x: W / 2, vx: 0, stun: 0 },
      parry: { active: false, press: -9, success: false, hits: 0, cd: 0, multi: null },
      particles: [], popups: [], debris: [], rings: [], callouts: [], blasts: [], lasers: [], phantoms: [],
      hitstop: 0, slowmo: 0, shake: 0, flash: 0, judge: null, overReason: '', flight: 0,

  }

  function makeBlock(type, x, y, w, h, hp) {
    return { type, x, y, w, h, hp, maxHp: hp, flash: 0, fireT: 0, tele: false, fall: 0, shots: 0, sup: false, depth: 0 };
  }

  function loadWave(n) {
    finishCascade(); finishBlastChain();
    G.wave = n;
    G.base = ((n - 1) % 60) + 1;
    G.loop = Math.floor((n - 1) / 60);
    G.lm = 1 + 0.15 * G.loop;
    G.rng = mulberry32(n * 131 + 7);          // 反射ブロック用の固定シード
    G.form = { ox: 0, oy: 0 };
    G.bullets = []; G.blasts = []; G.lasers = []; G.phantoms = [];
    G.debris = G.debris.filter(d => d.dropped);
    G.boss = null;
    G.blocks = [];
    if (G.base % 10 === 0) buildBoss(G.base / 10 - 1);
    else {
      const lay = genLayout(G.base);
      lay.forEach((row, r) => {
        for (let c = 0; c < 14; c++) {
          const ch = row[c]; if (ch === '.') continue;
          G.blocks.push(makeBlock(ch, GX0 + c * CW, GY0 + r * CH, CW, CH, HP[ch]));
        }
      });
    }
    const ti = turretInterval();
    for (const b of G.blocks) if (b.type === 'T') b.fireT = 1.6 + ti * (0.3 + G.rng() * 1.2);
    initSupport();
    G.ball = { x: G.paddle.x, y: PADDLE_Y - BR - 1, vx: 0, vy: 0, speed: targetSpeed(), attached: true, pierce: 0, breaker: false, trail: [] };
    G.countdown = 1.0;
    G.waveTime = 0; G.launched = false;
    G.lastBlockHit = -9; G.lastContact = { t: -9, used: true };
    G.parry.active = false;
    G.flight = 0;
    G.structDirty = false;
    G.mode = 'play';
    G.lowest = 0;
    G.banner = { text: G.boss ? 'WARNING' : 'WAVE ' + n, sub: G.boss ? 'BOSS ' + (G.boss.idx + 1) + '  —  HIT CORES WITH PARRIED RED BULLETS AND PIERCING SHOTS' : waveSub(), t: 0 };
    if (G.boss) SFX.alarm();

  function waveSub() {
    const intro = {
      2: 'NEW: KEYSTONE — BREAK IT TO COLLAPSE BLOCKS',
      4: 'NEW: TURRET — PARRY ITS BULLETS',
      6: 'NEW: EXPLOSIVE — CHAIN BLASTS; PARRY THE DEBRIS',
      8: 'NEW: REFLECTOR — CHANGES BALL TRAJECTORY',
      14: 'NEW: MAGNET — ATTRACTS THE BALL',
      20: 'NEW: SPLITTER — SCATTERS SMALL BLOCKS',

  function buildBoss(idx) {
    const tpl = BOSS_T[Math.min(idx, 2)];
    const cols = tpl[0].length;
    const left = (W - cols * CW) / 2;
    const coreHp = BOSS_CORE_HP[Math.min(idx, 5)];
    tpl.forEach((row, r) => {
      for (let c = 0; c < cols; c++) {
        const ch = row[c]; if (ch === '.') continue;
        if (ch === 'C') G.blocks.push(makeBlock('C', left + c * CW, GY0 + r * CH, CW, CH * 2, coreHp));
        else G.blocks.push(makeBlock(ch, left + c * CW, GY0 + r * CH, CW, CH, HP[ch]));
      }
    });
    const cores = G.blocks.filter(b => b.type === 'C');
    G.boss = {
      idx, left, cols, rows: tpl.length, amp: Math.max(40, (W - cols * CW) / 2 - 30),
      maxHp: cores.length * coreHp, phase: 1, time: BOSS_TIME[Math.min(idx, 5)], t: 0,
      fanT: 2.5, aimT: 2, laserT: 3, spiralT: 0, spiralA: 0, spiralCycle: 0, spiralN: 0, plunge: false,
    };
  }

  // =====================================================================
  //  崩落システム: 要石(K)・ボスのコア(C)を支点に、辺で接するブロックが支え合う
  // =====================================================================
  const STRUCT = b => b.type !== '#' && b.type !== 's';
  const ANCHOR = b => b.type === 'K' || b.type === 'C';
  function adjacent(a, b) {
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return (Math.abs(ox) <= 1.5 && oy > 2) || (Math.abs(oy) <= 1.5 && ox > 2);
  }
  function initSupport() {
    for (const b of G.blocks) b.sup = false;
    computeSupport(true);
  }
  // 支点から辿れなくなったブロックを返す (init 時は支点に繋がる塊を sup=true にする)
  function computeSupport(init) {
    const S = G.blocks.filter(b => STRUCT(b) && (init || b.sup));
    const n = S.length;
    const adj = Array.from({ length: n }, () => []);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      if (adjacent(S[i], S[j])) { adj[i].push(j); adj[j].push(i); }
    }
    const depth = new Array(n).fill(-1), q = [];
    for (let i = 0; i < n; i++) if (ANCHOR(S[i])) { depth[i] = 0; q.push(i); }
    for (let h = 0; h < q.length; h++) {
      const i = q[h];
      for (const j of adj[i]) if (depth[j] < 0) { depth[j] = depth[i] + 1; q.push(j); }
    }
    const lost = [];
    for (let i = 0; i < n; i++) {
      if (depth[i] >= 0) { S[i].sup = true; S[i].depth = depth[i]; }
      else if (!init) lost.push(S[i]);
    }
    return lost;
  }
  function collapse(list, origin) {
    const c = G.cascade;
    for (const bl of list) {
      const i = G.blocks.indexOf(bl); if (i >= 0) G.blocks.splice(i, 1);
      if (bl.type === 'T') killBulletsOf(bl);
      const cx = bl.x + G.form.ox + bl.w / 2, cy = bl.y + G.form.oy + bl.h / 2;
      const d = Math.hypot(cx - origin.x, cy - origin.y);
      G.debris.push({
        rx: bl.x, ry: bl.y, x: 0, y: 0, w: bl.w, h: bl.h, type: bl.type, col: blockColor(bl), pts: blockPts(bl),
        delay: 0.06 + d / 1100, dropped: false, vx: 0, vy: 0, rot: 0, vr: 0, ox: origin.x, scoring: true,
      });
    }
    c.n += list.length; c.t = 0.9;
    if (c.n >= 5) {
      const txt = (c.n >= 40 ? 'CATASTROPHE' : c.n >= 20 ? 'MEGA COLLAPSE' : 'COLLAPSE') + ' ×' + c.n;
      if (c.callout && G.callouts.includes(c.callout)) { c.callout.text = txt; c.callout.t = Math.min(c.callout.t, 0.12); }
      else c.callout = callout(txt, '', '#ffffff', 32, true);
      c.callout.size = c.n >= 40 ? 46 : c.n >= 20 ? 38 : 32;
      c.callout.color = c.n >= 40 ? '#ff4dd8' : c.n >= 20 ? '#ffe14d' : '#ffffff';
    }
    // 崩落の瓦礫が降ってくる (パリィで撃ち返せる)
    if (list.length >= 4 && G.mode === 'play') {
      const k = Math.min(6, Math.ceil(list.length / 5));
      for (let j = 0; j < k; j++) {
        const bl = list[Math.floor(Math.random() * list.length)];
        spawnHostile(bl.x + G.form.ox + bl.w / 2, bl.y + G.form.oy + bl.h, rand(-50, 50), rand(170, 240) * G.lm, 'shard');
      }
    }
    if (list.length >= 14) G.slowmo = Math.max(G.slowmo, 0.35);
    G.shake = Math.max(G.shake, Math.min(16, 4 + list.length * 0.4));
    SFX.crumble();
  }
  function updateDebris(dt) {
    const c = G.cascade;
    for (let i = G.debris.length - 1; i >= 0; i--) {
      const d = G.debris[i];
      if (!d.dropped) {
        d.delay -= dt;
        if (d.delay > 0) continue;
        d.dropped = true;
        d.x = d.rx + G.form.ox; d.y = d.ry + G.form.oy;
        const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
        d.vx = (cx - d.ox) * 0.7 + rand(-60, 60); d.vy = rand(-160, -40); d.vr = rand(-7, 7);
        if (d.scoring && G.mode !== 'over') {
          const v = d.pts * mult();
          G.score += v; addHeat(2);
          popup(cx, cy, '+' + fmt(v), d.col, 11);
          SFX.note(c.notes++);
          if (d.type === 'B') queueBlast(cx, cy, 0.12, BLAST_R, true, 'bomb');
        }
        burst(cx, cy, 5, d.col, 160);
        continue;
      }
      d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      if (d.y > H + 60) G.debris.splice(i, 1);
    }
  }

  // ---- 爆発 (爆薬 / ブレイカー / 分身弾の最後) -------------------------
  function queueBlast(x, y, delay, r, shrap, kind) { G.blasts.push({ x, y, r, delay, shrap, kind }); }
  function updateBlasts(dt) {
    for (let i = G.blasts.length - 1; i >= 0; i--) {
      const e = G.blasts[i];
      e.delay -= dt;
      if (e.delay > 0) continue;
      G.blasts.splice(i, 1);
      explode(e);
    }
  }
  function explode(e) {
    const big = e.kind === 'breaker';
    ring(e.x, e.y, e.r, big ? '#ff6bf0' : e.kind === 'phantom' ? '#ff4dd8' : '#ff9a3d', big ? 7 : 4);
    burst(e.x, e.y, big ? 50 : 24, big ? '#ffd0fb' : '#ffb347', big ? 520 : 360);
    G.shake = Math.max(G.shake, big ? 16 : 9);
    big ? SFX.breaker() : SFX.blast();
    if (G.mode === 'play') {
      const hits = G.blocks.filter(bl => circleRect(e.x, e.y, e.r, bl.x + G.form.ox, bl.y + G.form.oy, bl.w, bl.h));
      for (const bl of hits) {
        if (!G.blocks.includes(bl)) continue;
        const t = bl.type;
        if (t === 'C') damageCore(bl, big ? 2 : 1);
        else if (t === '#') { if (G.od) destroyBlock(bl, 'blast'); else bl.flash = 0.08; }
        else if (t === 'X') { if (big || G.od) destroyBlock(bl, 'blast'); else bl.flash = 0.1; }
        else if (t === 'R' || t === 'M') damage(bl, 2, 'blast');
        else destroyBlock(bl, 'blast');
      }
    }
    if (e.kind === 'bomb') {
      const bc = G.blastChain;
      bc.n++; bc.t = 0.7;
      if (bc.n >= 3) {
        const txt = 'CHAIN BLAST ×' + bc.n;
        if (bc.callout && G.callouts.includes(bc.callout)) { bc.callout.text = txt; bc.callout.t = Math.min(bc.callout.t, 0.12); }
        else bc.callout = callout(txt, '', '#ff9a3d', 32, true);
      }
      if (bc.n >= 4) G.slowmo = Math.max(G.slowmo, 0.25);
      // 破片: 下方向へ 3 発 (パリィ可能)
      if (e.shrap && G.mode === 'play') {
        for (let k = -1; k <= 1; k++) {
          const a = Math.PI / 2 + k * 28 * DEG + rand(-0.1, 0.1);
          spawnHostile(e.x, e.y, Math.cos(a) * 250 * G.lm, Math.sin(a) * 250 * G.lm, 'shrapnel');
        }
      }
    }
  }
  function triggerBreaker(x, y) {
    queueBlast(x, y, 0, BREAKER_R, false, 'breaker');
    G.hitstop = Math.max(G.hitstop, 0.06);
    G.slowmo = Math.max(G.slowmo, 0.25);
    G.flash = 0.2; G.flashColor = '#ffb8f7';
  }

  // ---- 連鎖の集計 -------------------------------------------------------
  function updateCombos(dt) {
    const c = G.cascade;
    if (c.n > 0) { c.t -= dt; if (c.t <= 0 && !G.debris.some(d => !d.dropped)) finishCascade(); }
    const bc = G.blastChain;
    if (bc.n > 0) { bc.t -= dt; if (bc.t <= 0 && !G.blasts.length) finishBlastChain(); }
  }
  function finishCascade() {
    const c = G.cascade; if (!c || c.n <= 0) return;
    let bonus = 0;
    if (c.n >= 5 && G.mode !== 'over') { bonus = c.n * c.n * 10 * mult(); G.score += bonus; }
    G.stats.bestCollapse = Math.max(G.stats.bestCollapse, c.n);
    if (c.callout) { c.callout.hold = false; c.callout.t = 0.3; c.callout.sub = bonus ? '+' + fmt(bonus) : ''; }
    c.n = 0; c.notes = 0; c.callout = null;
  }
  function finishBlastChain() {
    const bc = G.blastChain; if (!bc || bc.n <= 0) return;
    let bonus = 0;
    if (bc.n >= 2 && G.mode !== 'over') { bonus = bc.n * bc.n * 300 * mult(); G.score += bonus; }
    G.stats.bestBlast = Math.max(G.stats.bestBlast, bc.n);
    if (bc.callout) { bc.callout.hold = false; bc.callout.t = 0.3; bc.callout.sub = bonus ? '+' + fmt(bonus) : ''; }
    else if (bonus) popup(W / 2, 260, 'CHAIN BLAST ×' + bc.n + '  +' + fmt(bonus), '#ff9a3d', 15);
    bc.n = 0; bc.callout = null;
  }

  // =====================================================================
  //  入力 (イベントの時刻を保持し、判定はシミュレーション時刻で行う)
  // =====================================================================
  addEventListener('keydown', e => {
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    auInit();
    if (e.repeat) return;
    IN.keys[e.code] = true;
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) IN.useMouse = false;
    if (e.code === 'Space' || e.code === 'Enter') IN.actions.push({ t: e.timeStamp });
    if (e.code === 'Escape') togglePause();
    if (e.code === 'KeyQ' && G.paused) toTitle();
  });
  addEventListener('keyup', e => { IN.keys[e.code] = false; });
  function toGame(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  cv.addEventListener('mousemove', e => {
    const p = toGame(e);
    if (Math.abs(p.x - IN.mouseX) > 0.5) IN.useMouse = true;
    IN.mouseX = p.x;
  });
  cv.addEventListener('mousedown', e => {
    auInit();
    if (e.button !== 0) return;
    IN.mouseX = toGame(e).x;
    IN.actions.push({ t: e.timeStamp });
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('blur', () => { if (G.mode === 'play' || G.mode === 'clear') setPause(true); });

  function setPause(p) {
    if (G.mode !== 'play' && G.mode !== 'clear') return;
    if (G.paused === p) return;
    pauseOverlayDrawn = false;
    G.paused = p;
    acc = 0;
    if (p) {
      if (frameRequest !== null) cancelAnimationFrame(frameRequest);
      frameRequest = null;
      render();
      if (typeof updateMobileScreens === "function") updateMobileScreens();
    } else {
      last = performance.now();
      if (frameRequest === null) frameRequest = requestAnimationFrame(frame);
    }
    IN.actions.length = 0;
    if (AU.ctx) { if (p) AU.ctx.suspend(); else AU.ctx.resume(); }
  }
  function togglePause() {
    if (G.mode === 'over') return;
    setPause(!G.paused);
  }
  function toTitle() {
    G.paused = false; G.mode = 'title'; G.od = false; G.heat = 0;
    last = performance.now(); acc = 0;
    if (frameRequest === null) frameRequest = requestAnimationFrame(frame);
    musicCut();
    if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  }
  function pollPad(now) {
    IN.padX = 0;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p) continue;
      const ax = p.axes[0] || 0;
      if (Math.abs(ax) > 0.2) IN.padX = ax;
      if (p.buttons[14] && p.buttons[14].pressed) IN.padX = -1;
      if (p.buttons[15] && p.buttons[15].pressed) IN.padX = 1;
      if (IN.padX) IN.useMouse = false;
      const a = !!(p.buttons[0] && p.buttons[0].pressed);
      const rt = !!(p.buttons[7] && (p.buttons[7].value > 0.5 || p.buttons[7].pressed));
      const st = !!(p.buttons[9] && p.buttons[9].pressed);
      if ((a && !IN.pa) || (rt && !IN.prt)) { auInit(); IN.actions.push({ t: now }); }
      if (st && !IN.pst) togglePause();
      IN.pa = a; IN.prt = rt; IN.pst = st;
      break;
    }
  }

  // =====================================================================
  //  アクション (発射 / パリィ)
  // =====================================================================
  function processActions() {
    const t0 = G.t - DT;
    while (IN.actions.length) {
      const a = IN.actions[0];
      if (G.mode === 'title') { IN.actions.length = 0; newGame(); return; }
      if (G.mode === 'over') {
        IN.actions.shift();
        if (G.overT > 1.0) { IN.actions.length = 0; newGame(); return; }
        continue;
      }
      if (G.mode !== 'play') { IN.actions.shift(); continue; }
      let st = SYNC.sim + (a.t - SYNC.wall) / 1000 * SYNC.scale;
      if (!isFinite(st) || st > G.t + 0.25 || st < t0 - 0.25) st = G.t;
      if (st > G.t) break;   // 次のステップで処理する
      IN.actions.shift();
      onAct(Math.max(st, t0) - INPUT_LAG);
    }
  }
  function onAct(pt) {
    const b = G.ball, P = G.paddle, p = G.parry;
    if (b.attached) {
      if (G.countdown <= 0) launch();
      return;
    }
    if (P.stun > 0) return;
    if (p.active || pt < p.cd) return;
    // 接触の「後」0.03 秒以内の入力も PERFECT (接触の前後 0.03 秒)
    const dl = pt - G.lastContact.t;
    if (!G.lastContact.used && dl <= PERFECT_WIN && dl >= -PARRY_WIN) {
      const ad = Math.abs(dl);
      G.lastContact.used = true;
      p.hits = 0;
      const activeBall = G.ball;
      G.ball = G.lastContact.ball && !G.lastContact.ball.lost ? G.lastContact.ball : activeBall;
      applyParry(ad <= JUST_WIN ? 'JUST' : ad <= PERFECT_WIN ? 'PERFECT' : 'GOOD', 'ball', G.ball.x, PADDLE_Y);
      G.ball = activeBall;
      return;
    }
    p.active = true; p.press = pt; p.success = false; p.hits = 0;
  }
  function launch() {
    const b = G.ball;
    b.attached = false;
    const a = 8 * DEG * (G.paddle.x < W / 2 ? 1 : -1);
    b.speed = targetSpeed();
    b.vx = Math.sin(a) * b.speed; b.vy = -Math.cos(a) * b.speed;
    if (!G.launched) { G.launched = true; G.waveTime = 0; }
    G.flight = 0;
    SFX.launch();
  }


  const PADDLE_MAX_W = 180;
  const PADDLE_HEAT_WIDTHS = [120, 135, 150, 165, PADDLE_MAX_W];
  function paddleWidth() { return PADDLE_HEAT_WIDTHS[G.od ? 4 : stage()]; }
  function syncPaddleWidth() {
    const width = paddleWidth();
    G.paddle.x = clamp(G.paddle.x, width / 2, W - width / 2);
    if (IN.useMouse) IN.mouseX = clamp(IN.mouseX, width / 2, W - width / 2);
  }

  function applyParry(grade, kind, x, y) {
    const p = G.parry, P = G.paddle;
    const just = grade === 'JUST', perfect = just || grade === 'PERFECT';

    const wasOD = G.od;
    p.success = true; p.cd = 0; p.hits = (p.hits || 0) + 1;
    G.streak++; G.maxStreak = Math.max(G.maxStreak, G.streak);
    G.score += G.streak * 100;
    if (just) G.stats.just++;
    if (kind === 'ball') {
      const b = G.ball;
      addHeat(just ? 160 : perfect ? 120 : 60);
      b.pierce = Math.max(b.pierce, perfect ? 3 : 1);
      if (just) b.breaker = true;   // 次にブロックへ当たった瞬間に衝撃波
      G.hitstop = Math.max(G.hitstop, just ? 0.1 : perfect ? 0.08 : 0.05);
      G.shake = Math.max(G.shake, just ? 12 : perfect ? 9 : 5);
      if (wasOD && perfect) spawnPhantoms(just ? 3 : 2);
    } else {
      addHeat(just ? 70 : perfect ? 50 : 25);
      G.hitstop = Math.max(G.hitstop, 0.03);
      G.shake = Math.max(G.shake, 4);
    }
    if (wasOD && perfect) G.odTime = Math.min(G.odTime + (just ? 2 : 1), OD_MAX);
    const col = just ? '#ff6bf0' : perfect ? '#ffe14d' : '#4dfcff';
    G.judge = { text: just ? 'JUST!!' : grade, t: 0, color: col, big: just };
    just ? SFX.just() : perfect ? SFX.perfect() : SFX.good();
    const px = x != null ? x : P.x;
    burst(px, y != null ? y : PADDLE_Y, just ? 40 : perfect ? 28 : 14, col, just ? 520 : perfect ? 420 : 280);
    ring(px, PADDLE_Y, just ? 110 : perfect ? 70 : 40, col, just ? 5 : 3);
    if (just) { G.flash = Math.max(G.flash, 0.15); G.flashColor = '#ff9cf5'; G.slowmo = Math.max(G.slowmo, 0.15); }
    if (p.hits >= 3) {
      const txt = 'MULTI PARRY ×' + p.hits;
      if (p.multi && G.callouts.includes(p.multi)) { p.multi.text = txt; p.multi.t = Math.min(p.multi.t, 0.12); }
      else p.multi = callout(txt, '', '#4dfcff', 28);
    }
    if (G.streak >= 2) popup(P.x, PADDLE_Y - 64, 'CHAIN ' + G.streak, '#ffffff', 14);
  }
  function addHeat(v) {
    if (G.od) return;
    G.heat = Math.max(0, G.heat + v);
    if (G.heat >= OD_HEAT) startOD();
  }
  function startOD() {
    G.od = true; G.heat = OD_HEAT; G.odTime = OD_TIME; G.odElapsed = 0;
    G.flash = 0.5; G.shake = 14;
    SFX.od();
    G.banner = { text: 'OVERDRIVE', sub: 'FULL PIERCE x16 — PERFECT SPAWNS PHANTOMS', t: 0, od: true };
  }
  function endOD() {
    G.od = false; G.heat = STAGE_MIN[2];
    if (G.phantoms.length) callout('OVERDRIVE FINISH', '', '#ff4dd8', 30);
    SFX.odEnd();
  }
  function hurt() {

    G.heat = 0;
    if (G.od) G.od = false;
    G.paddle.stun = STUN;
    G.shake = 12; G.flash = 0.25; G.flashColor = '#ff2040';
    G.parry.active = false;
    SFX.hurt(); musicDuck();
    G.judge = { text: 'HIT!', t: 0, color: '#ff4060' };
    burst(G.paddle.x, PADDLE_Y, 20, '#ff4060', 300);
  }

  // ---- 分身弾 (OVERDRIVE 中の PERFECT / JUST で発生) --------------------
  function spawnPhantoms(n) {
    const b = G.ball;
    for (let k = 0; k < n && G.phantoms.length < PHANTOM_MAX; k++) {
      const a = (k - (n - 1) / 2) * 26 * DEG + (k === (n - 1) / 2 ? 12 * DEG : 0) + rand(-0.06, 0.06);
      const sp = b.speed;
      G.phantoms.push({ x: b.x, y: PADDLE_Y - BR - 2, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp, speed: sp, attached: false, trail: [], pierce: 0, breaker: false, flight: 0 });
    }
    SFX.phantom();
  }
  function popPhantoms() {
    for (const f of G.phantoms) queueBlast(f.x, f.y, rand(0.03, 0.2), 70, false, 'phantom');
    G.phantoms = [];
  }
  function updateAllBalls(dt) {
    const initial = [G.ball, ...G.phantoms].filter(Boolean);
    const original = G.ball;
    for (const ball of initial) {
      if (ball.lost) continue;
      G.ball = ball;
      G.flight = ball.flight || 0;
      updateBall(dt);
      ball.flight = G.flight;
      if (G.mode !== 'play') { G.ball = original; return; }
    }
    const survivors = [...new Set([...initial, ...G.phantoms])].filter(ball => !ball.lost);
    if (!survivors.length) {
      G.ball = original; G.phantoms = []; gameOver('BALL LOST'); return;
    }
    G.ball = survivors[0]; G.phantoms = survivors.slice(1);
    G.flight = G.ball.flight || 0;
  }

  // =====================================================================
  //  更新
  // =====================================================================
  function step(dt) {
    G.t += dt;
    processActions();

    if (G.mode === 'play') updatePlay(dt);
    else if (G.mode === 'clear') { updateClear(dt); updateBlasts(dt); }
    else if (G.mode === 'over') G.overT += dt;
    if (G.mode === 'play' || G.mode === 'clear') updateCombos(dt);
    if (G.mode !== 'title') updateDebris(dt);
    updateFx(dt);
    syncPaddleWidth();
  }

  function updatePlay(dt) {
    const P = G.paddle, p = G.parry, b = G.ball;
    // パドル
    const px0 = P.x;
    if (P.stun > 0) P.stun -= dt;
    else {
      if (IN.useMouse) P.x = IN.mouseX;
      else {
        const k = IN.keys;
        const dir = clamp(((k.ArrowLeft || k.KeyA) ? -1 : 0) + ((k.ArrowRight || k.KeyD) ? 1 : 0) + IN.padX, -1, 1);
        P.x += dir * PADDLE_SPEED * dt;
      }
      P.x = clamp(P.x, paddleWidth() / 2, W - paddleWidth() / 2);
    }
    P.vx = (P.x - px0) / dt;
    // パリィ判定ウィンドウの終了
    if (p.active && G.t - p.press > PARRY_WIN) {
      p.active = false;
      if (!p.success) {

        p.cd = p.press + PARRY_CD;
        G.streak = 0;
        G.judge = { text: 'MISS', t: 0, color: '#8a8aa0' };
        SFX.miss();
      }
    }
    if (G.countdown > 0) {
      G.countdown -= dt;
      if (G.countdown <= 0) SFX.count();
    }
    const active = G.countdown <= 0;
    if (active) {
      G.waveTime += dt;
      if (G.boss) updateBoss(dt);
      else {
        // 降下: ボールがブロックに当たっている間は半速
        const sp = descentSpeed() * (G.t - G.lastBlockHit < 0.5 ? 0.5 : 1);
        G.form.oy += sp * dt;
      }
    }
    // ヒート減衰 / OVERDRIVE
    if (!b.attached) {
      if (G.od) {
        G.odTime -= dt; G.odElapsed += dt;
        if (G.odTime <= 0) endOD();
      } else {
        const st = stage();
        if (st >= 1) G.heat = Math.max(0, G.heat - DECAY[st] * dt);
      }
    }
    updateAllBalls(dt);
    if (G.mode !== 'play') return;
    if (active) updateTurrets(dt);
    updateBullets(dt);
    if (G.mode !== 'play') return;
    updateLasers(dt);
    updateBlasts(dt);
    // 支えを失った塊を崩落させる
    if (G.structDirty) {
      G.structDirty = false;
      const lost = computeSupport(false);
      if (lost.length) collapse(lost, G.lastBreak || { x: W / 2, y: GY0 });
    }
    for (const bl of G.blocks) {
      if (bl.flash > 0) bl.flash -= dt;
      if (bl.fall > 0) { const d = Math.min(bl.fall, 180 * dt); bl.y += d; bl.fall -= d; }
    }
    // クリア判定 (G.lowest は直前フレームの値 = 最後のブロックを含む)
    const clear = G.boss ? !G.blocks.some(x => x.type === 'C') : !G.blocks.some(x => CLEARABLE.has(x.type));
    if (clear) { waveClear(); return; }
    let low = 0;
    for (const bl of G.blocks) low = Math.max(low, bl.y + G.form.oy + bl.h);
    G.lowest = low;
    if (low >= WARN_Y) gameOver(G.boss && G.boss.plunge ? 'TIME OVER' : 'BLOCKS BREACHED');
  }

  function fixAngle(b) {
    const s = Math.hypot(b.vx, b.vy) || 1;
    let nx = b.vx / s, ny = b.vy / s;
    if (Math.abs(ny) < Math.sin(MIN_ANGLE)) {
      ny = (ny > 0 ? 1 : -1) * Math.sin(MIN_ANGLE);
      nx = (nx < 0 ? -1 : 1) * Math.cos(MIN_ANGLE);
    }
    b.vx = nx * b.speed; b.vy = ny * b.speed;
  }

  function updateBall(dt) {
    const b = G.ball, P = G.paddle;
    if (b.attached) { b.x = P.x; b.y = PADDLE_Y - BR - 1; b.trail.length = 0; return; }
    // 段階移行時に補間して加速
    b.speed += (targetSpeed() - b.speed) * Math.min(1, (G.od ? 2 : 4) * dt);
    if (G.od) b.speed = Math.min(b.speed, OD_MAX_SPEED);
    // 磁力ブロック: 半径 140px 内で 220px/s² の引力
    for (const bl of G.blocks) {
      if (bl.type !== 'M') continue;
      const cx = bl.x + G.form.ox + bl.w / 2, cy = bl.y + G.form.oy + bl.h / 2;
      const dx = cx - b.x, dy = cy - b.y, d = Math.hypot(dx, dy);
      if (d < 140 && d > 1) { b.vx += dx / d * 220 * dt; b.vy += dy / d * 220 * dt; }
    }
    {
      const s = Math.hypot(b.vx, b.vy) || 1;
      b.vx = b.vx / s * b.speed; b.vy = b.vy / s * b.speed;
    }
    const n = Math.max(1, Math.ceil(b.speed * dt / 4));
    const sdt = dt / n, t0 = G.t - dt;
    for (let i = 0; i < n; i++) {
      const py = b.y;
      b.x += b.vx * sdt; b.y += b.vy * sdt;
      if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); SFX.wall(); }
      if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); SFX.wall(); }
      if (b.y < TOP_Y + BR) { b.y = TOP_Y + BR; b.vy = Math.abs(b.vy); SFX.wall(); }
      collideBlocks(b);
      if (G.mode !== 'play') return;
      if (b.vy > 0 && b.y + BR >= PADDLE_Y && py + BR <= PADDLE_Y + 8 &&
          Math.abs(b.x - P.x) <= paddleWidth() / 2 + BR * 0.6) {
        // 接触時刻をサブステップ内で補間して求める
        const fr = b.y !== py ? clamp((PADDLE_Y - (py + BR)) / (b.y - py), 0, 1) : 1;
        paddleBounce(t0 + sdt * (i + fr));

    else { u.vx = 0; u.vy = -sp; }
    applyParry(grade, 'bullet', u.x, PADDLE_Y);
  }

  function waveClear() {
    const m = mult(), bon = [];
    if (G.boss) bon.push(['BOSS DESTROYED', 50000 + Math.floor(G.boss.time) * 500]);
    bon.push(['WAVE CLEAR  ×' + m, 5000 * m]);
    if (!G.boss) {
      const dist = Math.max(0, WARN_Y - G.lowest);
      bon.push(['DISTANCE ' + Math.round(dist) + 'px', Math.round(dist) * 20]);
      if (G.waveTime <= 10) bon.push(['ANNIHILATION  ×' + m, 20000 * m]);
    }
    if (G.streak > 0) bon.push(['NO-MISS CHAIN ' + G.streak, G.streak * 500]);
    G.ending = G.base === 60;
    if (G.ending) bon.push(['ALL 60 WAVES CLEAR', 1000000]);
    let sum = 0; for (const b of bon) sum += b[1];
    G.score += sum;
    G.bonuses = bon;
    // 残ったブロック (破壊不可など) も崩れ落ちる
    for (const bl of G.blocks) {
      G.debris.push({
        rx: bl.x, ry: bl.y, x: 0, y: 0, w: bl.w, h: bl.h, type: bl.type, col: blockColor(bl), pts: 0,
        delay: rand(0.05, 0.5), dropped: false, vx: 0, vy: 0, rot: 0, vr: 0, ox: W / 2, scoring: false,
      });
    }
    G.blocks = []; G.bullets = []; G.lasers = [];
    if (G.phantoms.length) popPhantoms();
    G.mode = 'clear'; G.clearT = 0;
    SFX.clear();
  }
  function updateClear(dt) {
    G.clearT += dt;
    G.ball.trail.length = 0;
    if (G.clearT > (G.ending ? 5 : 2.8)) loadWave(G.wave + 1);
  }

  function gameOver(reason) {
    if (G.mode === 'over') return;
    G.mode = 'over'; G.overT = 0; G.overReason = reason;
    G.od = false; G.parry.active = false;
    G.phantoms = []; G.lasers = [];
    finishCascade(); finishBlastChain();
    musicCut(); SFX.over();
    G.shake = 20; G.flash = 0.4; G.flashColor = '#ff2040';
    burst(G.ball.x, Math.min(G.ball.y, H - 10), 40, '#ffffff', 400);
    G.newBest = G.score > G.best;
    if (G.newBest) { G.best = G.score; storage.set('ro_best', G.best); }
    if (G.wave > G.bestWave) { G.bestWave = G.wave; storage.set('ro_bestwave', G.bestWave); }
  }

  // ---- エフェクト ------------------------------------------------------
  function burst(x, y, n, color, sp) {
    for (let i = 0; i < n; i++) {
      if (G.particles.length > 600) G.particles.shift();
      const a = Math.random() * Math.PI * 2, v = sp * (0.2 + Math.random() * 0.8);
      G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.3 + Math.random() * 0.4, color, size: 1.5 + Math.random() * 2.5 });
    }
  }
  function popup(x, y, text, color, size) {
    if (G.popups.length > 50) G.popups.shift();
    G.popups.push({ x, y, text, color, size, t: 0 });
  }
  function ring(x, y, r, color, wd) {
    if (G.rings.length > 40) G.rings.shift();
    G.rings.push({ x, y, r, color, wd, t: 0, life: 0.45 });
  }
  function callout(text, sub, color, size, hold) {
    const c = { text, sub, color, size, t: 0, life: 1.6, hold: !!hold };
    G.callouts.push(c);
    if (G.callouts.length > 3) G.callouts.shift();
    return c;
  }
  function updateFx(dt) {
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
      if (p.life >= p.max) G.particles.splice(i, 1);
    }
    for (let i = G.popups.length - 1; i >= 0; i--) {
      const p = G.popups[i]; p.t += dt; p.y -= 30 * dt;
      if (p.t > 0.8) G.popups.splice(i, 1);
    }
    for (let i = G.rings.length - 1; i >= 0; i--) {
      const r = G.rings[i]; r.t += dt;
      if (r.t > r.life) G.rings.splice(i, 1);
    }
    for (let i = G.callouts.length - 1; i >= 0; i--) {
      const c = G.callouts[i]; c.t += dt;
      if (c.hold && c.t > 0.3) c.t = 0.3;
      if (c.t > c.life) G.callouts.splice(i, 1);
    }
    if (G.judge) { G.judge.t += dt; if (G.judge.t > 0.6) G.judge = null; }
    if (G.banner) { G.banner.t += dt; if (G.banner.t > 1.8) G.banner = null; }
    G.shake = Math.max(0, G.shake - 60 * dt);
    G.flash = Math.max(0, G.flash - dt);
  }

  // =====================================================================
  //  描画
  // =====================================================================
  const FONT = 'Orbitron, "Segoe UI", system-ui, sans-serif';
  const JFONT = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif';
  function blockColor(bl) {
    if (bl.type === 'N') return COL['N' + tierOf(bl)];
    return COL[bl.type] || '#ffffff';
  }
  function text(s, x, y, size, color, align = 'center', font = FONT, weight = 700) {
    // Gameplay typography is independent of the menu language.
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.fillText(localizedCanvasText(s), x, y);
  }
  function glowText(s, x, y, size, color, blur = 18, align = 'center', font = FONT) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur;
    text(s, x, y, size, color, align, font, 900); ctx.restore();
  }

  let pauseOverlayDrawn = false;
  function render() {
    const snapshot = document.getElementById('pause-snapshot');
    if (G.paused) {
      if (pauseOverlayDrawn) return;
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; drawPause(); ctx.restore();
      const rect = cv.getBoundingClientRect();
      snapshot.src = cv.toDataURL('image/png');
      snapshot.style.left = Math.round(rect.left) + 'px';
      snapshot.style.top = Math.round(rect.top) + 'px';
      snapshot.style.width = Math.round(rect.width) + 'px';
      snapshot.style.height = Math.round(rect.height) + 'px';
      snapshot.hidden = false;
      cv.style.visibility = 'hidden';
      pauseOverlayDrawn = true;
      return;
    }
    snapshot.hidden = true;
    cv.style.visibility = 'visible';
    pauseOverlayDrawn = false;
    const inv = G.od && (G.mode === 'play');
    const f = inv ? 'invert(1) hue-rotate(180deg)' : 'none';
    if (cv.style.filter !== f) cv.style.filter = f;

    ctx.save();
    ctx.fillStyle = '#07060f'; ctx.fillRect(0, 0, W, H);
    if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);

    drawBackground();
    if (G.mode === 'title') { ctx.restore(); drawTitle(); return; }

    drawField();
    for (const bl of G.blocks) if (bl.type === 'M') drawMagnetField(bl);
    const t = performance.now() / 1000;
    for (const bl of G.blocks) drawBlock(bl, t);
    drawDebris(t);
    drawBullets();
    drawPhantoms();
    if (G.mode === 'play') drawBall();
    drawPaddle();
    drawLasers(t);
    drawRings();
    drawParticles();
    drawPopups();
    ctx.restore();

    drawEdgeFx();
    drawHUD();
    drawCallouts();
    drawBanners();
    if (G.mode === 'clear') drawClear();
    if (G.mode === 'over') drawOver();
    if (G.paused) drawPause();
    if (G.flash > 0) {
      ctx.globalAlpha = Math.min(0.6, G.flash);
      ctx.fillStyle = G.flashColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function drawBackground() {
    const t = performance.now() / 1000;
    ctx.strokeStyle = 'rgba(120,100,255,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 60) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    const off = (t * 20) % 48;
    for (let y = -48 + off; y <= H; y += 48) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
  }

  function drawField() {
    ctx.fillStyle = '#0d0b1c'; ctx.fillRect(0, 0, W, TOP_Y);
    ctx.strokeStyle = '#2a2550'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, TOP_Y); ctx.lineTo(W, TOP_Y); ctx.stroke();
    const danger = isDanger();
    const t = performance.now() / 1000;
    ctx.save();
    ctx.setLineDash([12, 8]); ctx.lineDashOffset = -t * 30;
    ctx.strokeStyle = danger ? `rgba(255,40,70,${0.6 + 0.4 * Math.sin(t * 14)})` : 'rgba(255,60,90,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, WARN_Y); ctx.lineTo(W, WARN_Y); ctx.stroke();
    ctx.restore();
    text('WARNING LINE', W - 16, WARN_Y - 18, 22, 'rgba(255,110,140,0.9)', 'right');
  }
  function isDanger() {
    if (G.mode !== 'play' || !G.blocks.length) return false;
    const sp = G.boss ? (G.boss.plunge ? 520 : 0) : descentSpeed();
    if (sp <= 0) return false;
    return (WARN_Y - G.lowest) / sp < 3;
  }

  function drawMagnetField(bl) {
    const x = bl.x + G.form.ox + bl.w / 2, y = bl.y + G.form.oy + bl.h / 2;
    const t = performance.now() / 1000;
    ctx.save();
    ctx.strokeStyle = 'rgba(77,132,255,0.18)'; ctx.setLineDash([4, 6]); ctx.lineDashOffset = t * 20;
    ctx.beginPath(); ctx.arc(x, y, 140, 0, Math.PI * 2); ctx.stroke();
    const r = 140 - ((t * 60) % 140);
    ctx.strokeStyle = `rgba(77,132,255,${0.15 * r / 140})`; ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawBlock(bl, t) {
    const x = bl.x + G.form.ox, y = bl.y + G.form.oy, w = bl.w, h = bl.h;
    if (bl.type === 'C') return drawCore(bl, x, y);
    const col = blockColor(bl);
    const ix = x + 2, iy = y + 2, iw = w - 4, ih = h - 4;
    if (bl.type === 'X') {
      const g = ctx.createLinearGradient(ix, iy, ix + iw, iy + ih);
      g.addColorStop(0, '#8a96a8'); g.addColorStop(0.45, '#f4f8ff'); g.addColorStop(0.55, '#c8d2e0'); g.addColorStop(1, '#6a7688');
      ctx.fillStyle = g; ctx.fillRect(ix, iy, iw, ih);
      const sx = ((t * 80 + bl.x) % (iw + 30)) - 15;
      ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.moveTo(ix + sx, iy); ctx.lineTo(ix + sx + 8, iy); ctx.lineTo(ix + sx - 2, iy + ih); ctx.lineTo(ix + sx - 10, iy + ih); ctx.closePath();
      ctx.fill(); ctx.restore();
    } else if (bl.type === '#') {
      ctx.fillStyle = '#1b1b26'; ctx.fillRect(ix, iy, iw, ih);
      ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
      ctx.strokeStyle = '#33334a'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = -ih; k < iw; k += 8) { ctx.moveTo(ix + k, iy + ih); ctx.lineTo(ix + k + ih, iy); }
      ctx.stroke(); ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(ix, iy, iw, ih);
    } else if (bl.type === 'K') {
      // 要石: 白く輝き、金のルーン
      const g = ctx.createLinearGradient(ix, iy, ix, iy + ih);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfc6ff');
      ctx.fillStyle = g; ctx.fillRect(ix, iy, iw, ih);
      const cx = x + w / 2, cy = y + h / 2;
      ctx.fillStyle = '#ffb800';
      ctx.beginPath(); ctx.moveTo(cx, cy - 7); ctx.lineTo(cx + 9, cy); ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 9, cy); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffb800'; ctx.lineWidth = 1.5; ctx.strokeRect(ix + 1, iy + 1, iw - 2, ih - 2);
      if (bl.hp < bl.maxHp) {
        ctx.strokeStyle = '#3a2a60'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(ix + 6, iy + 1); ctx.lineTo(ix + 16, iy + ih / 2); ctx.lineTo(ix + 10, iy + ih - 1);
        if (bl.hp < bl.maxHp - 1) { ctx.moveTo(ix + iw - 8, iy + 1); ctx.lineTo(ix + iw - 18, iy + ih / 2 + 2); ctx.lineTo(ix + iw - 12, iy + ih - 1); }
        ctx.stroke();
      }
      ctx.strokeStyle = `rgba(255,255,255,${0.35 + 0.25 * Math.sin(t * 5)})`; ctx.lineWidth = 2;
      ctx.strokeRect(ix - 2, iy - 2, iw + 4, ih + 4);
    } else if (bl.type === 'B') {
      // 爆薬: 警告色のストライプと点滅する信管
      ctx.fillStyle = '#3a1500'; ctx.fillRect(ix, iy, iw, ih);
      ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
      ctx.fillStyle = COL.B;
      for (let k = -ih; k < iw; k += 12) {
        ctx.beginPath(); ctx.moveTo(ix + k, iy + ih); ctx.lineTo(ix + k + 6, iy + ih); ctx.lineTo(ix + k + 6 + ih, iy); ctx.lineTo(ix + k + ih, iy); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = COL.B; ctx.lineWidth = 2; ctx.strokeRect(ix + 1, iy + 1, iw - 2, ih - 2);
      ctx.fillStyle = Math.sin(t * 10 + bl.x) > 0 ? '#ffffff' : '#ff3d1a';
      ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = col + '30'; ctx.fillRect(ix, iy, iw, ih);
      if (bl.type === 'T' && bl.tele) {
        const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 30));
        ctx.fillStyle = `rgba(255,60,90,${a * 0.7})`; ctx.fillRect(ix, iy, iw, ih);
      }
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(ix + 1, iy + 1, iw - 2, ih - 2);
      ctx.fillStyle = col + '90'; ctx.fillRect(ix + 3, iy + 3, iw - 6, 2);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      if (bl.type === 'T') {
        ctx.fillStyle = bl.tele ? '#ffffff' : col;
        ctx.fillRect(x + w / 2 - 5, y + h - 4, 10, 6);
        ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 5, 0, Math.PI * 2); ctx.fill();
      } else if (bl.type === 'R') {
        ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
        ctx.beginPath();
        for (let k = -ih; k < iw; k += 10) { ctx.moveTo(ix + k, iy); ctx.lineTo(ix + k + ih, iy + ih); }
        ctx.globalAlpha = 0.5; ctx.stroke(); ctx.restore();
      } else if (bl.type === 'M') {
        ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 6, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 2, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
      } else if (bl.type === 'S') {
        ctx.beginPath();
        ctx.moveTo(x + w / 2 - 8, y + 5); ctx.lineTo(x + w / 2, y + h / 2); ctx.lineTo(x + w / 2 - 4, y + h - 5);
        ctx.moveTo(x + w / 2, y + h / 2); ctx.lineTo(x + w / 2 + 9, y + h / 2 + 2);
        ctx.stroke();
      }
      if (bl.maxHp > 1 && bl.hp > 0) {
        ctx.fillStyle = '#ffffff';
        for (let k = 0; k < bl.hp; k++) ctx.fillRect(ix + iw - 6 - k * 6, iy + ih - 5, 3, 3);
      }
    }
    // 支えの脈動: 要石から塊へ光が伝わる (どこが繋がっているかが分かる)
    if (bl.sup && bl.type !== 'K') {
      const ph = (t * 8) % 16;
      const k = Math.max(0, 1 - Math.abs(ph - bl.depth) / 1.5);
      if (k > 0) { ctx.fillStyle = `rgba(255,255,255,${0.2 * k})`; ctx.fillRect(ix, iy, iw, ih); }
    }
    if (bl.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, bl.flash * 10)})`; ctx.fillRect(ix, iy, iw, ih); }
  }
  function drawCore(bl, x, y) {
    const cx = x + bl.w / 2, cy = y + bl.h / 2;
    const t = performance.now() / 1000;
    const pulse = 1 + 0.08 * Math.sin(t * 6);
    ctx.save();
    ctx.fillStyle = '#2a1e05'; ctx.fillRect(x + 2, y + 2, bl.w - 4, bl.h - 4);
    ctx.strokeStyle = COL.C; ctx.lineWidth = 2; ctx.strokeRect(x + 3, y + 3, bl.w - 6, bl.h - 6);
    ctx.shadowColor = COL.C; ctx.shadowBlur = 20;
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 18 * pulse);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, bl.flash > 0 ? '#ffffff' : COL.C); g.addColorStop(1, 'rgba(255,120,0,0.2)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 18 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#ff5a3d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, bl.hp) / bl.maxHp); ctx.stroke();
    text(String(Math.max(0, bl.hp)), cx, cy + 1, 12, '#1a1000');
  }

  function drawDebris(t) {
    for (const d of G.debris) {
      let x, y;
      if (!d.dropped) { x = d.rx + G.form.ox + rand(-1.5, 1.5); y = d.ry + G.form.oy + rand(-1.5, 1.5); }
      else { x = d.x; y = d.y; }
      ctx.save();
      ctx.translate(x + d.w / 2, y + d.h / 2);
      if (d.dropped) { ctx.rotate(d.rot); ctx.globalAlpha = clamp(1 - (d.y - WARN_Y) / 260, 0.15, 1); }
      ctx.fillStyle = d.col + '55'; ctx.fillRect(-d.w / 2 + 2, -d.h / 2 + 2, d.w - 4, d.h - 4);
      ctx.strokeStyle = d.col; ctx.lineWidth = 2; ctx.strokeRect(-d.w / 2 + 3, -d.h / 2 + 3, d.w - 6, d.h - 6);
      if (!d.dropped) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.3 * Math.sin(t * 50)})`;
        ctx.fillRect(-d.w / 2 + 2, -d.h / 2 + 2, d.w - 4, d.h - 4);
      }
      ctx.restore();
    }
  }

  function drawBullets() {
    for (const u of G.bullets) {
      if (u.dead) continue;
      let c;
      if (!u.hostile) c = u.red ? '#ffe14d' : '#4dfcff';
      else if (u.kind === 'shard') c = '#d9a066';
      else if (u.kind === 'shrapnel') c = '#ffb347';
      else c = u.red ? '#ff2a3d' : '#ff9d4d';
      ctx.globalAlpha = 0.25; ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      if (u.hostile && u.kind === 'shard') {
        ctx.save(); ctx.translate(u.x, u.y); ctx.rotate(u.rot);
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.moveTo(0, -u.r - 2); ctx.lineTo(u.r + 1, u.r); ctx.lineTo(-u.r, u.r - 1); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff3e0'; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
        continue;
      }
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r * 0.45, 0, Math.PI * 2); ctx.fill();
      if (u.hostile && u.red) {
        ctx.strokeStyle = 'rgba(255,42,61,0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 4, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function drawPhantoms() {
    const current = G.ball, flight = G.flight;
    for (const ball of G.phantoms) { G.ball = ball; G.flight = ball.flight || 0; drawBall(); }
    G.ball = current; G.flight = flight;
  }

  function drawBall() {
    const b = G.ball; if (!b) return;
    const st = stage();
    const pierce = b.pierce > 0 || G.od;
    const col = G.od ? '#ff4dd8' : b.breaker ? '#ff6bf0' : pierce ? '#ffe14d' : ['#ffffff', '#bff8ff', '#7ff0ff', '#4dfcff'][st];
    const tr = b.trail;
    for (let i = 0; i < tr.length; i++) {
      const a = (i + 1) / tr.length;
      if (G.od && i % 4 === 0) {
        ctx.strokeStyle = `rgba(255,77,216,${a * 0.5})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(tr[i].x, tr[i].y, BR, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = a * 0.45;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(tr[i].x, tr[i].y, BR * (0.3 + 0.7 * a), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = pierce ? 26 : 14;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, BR * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (b.breaker) {
      const a0 = performance.now() / 120;
      ctx.strokeStyle = '#ff6bf0'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = a0 + k * Math.PI / 4;
        ctx.moveTo(b.x + Math.cos(a) * 11, b.y + Math.sin(a) * 11); ctx.lineTo(b.x + Math.cos(a) * 20, b.y + Math.sin(a) * 20);
      }
      ctx.stroke();
    }
    if (b.pierce > 0 && !G.od) {
      for (let k = 0; k < b.pierce; k++) {
        const a = performance.now() / 150 + k * Math.PI * 2 / b.pierce;
        ctx.fillStyle = '#ffe14d';
        ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * 14, b.y + Math.sin(a) * 14, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (G.flight >= 5 && !b.attached) text(G.flight + ' HIT', b.x, b.y - 24, 11, G.flight >= 15 ? '#ffe14d' : '#cfd6ff');
    if (b.attached && !G.paused) {
      const s = G.countdown > 0 ? 'READY' : ''; 
      if (s) text(s, b.x, b.y - 30, 22, '#ffe14d');
      else drawLaunchHint(b.x, b.y - 32);
    }
  }

  function drawPaddle() {
    const P = G.paddle, p = G.parry || {};
    const x = P.x - paddleWidth() / 2, y = PADDLE_Y;
    const t = performance.now() / 1000;
    const stunned = P.stun > 0;
    const cooling = G.t < (p.cd || 0);
    let col = '#4dfcff';
    if (stunned) col = Math.sin(t * 40) > 0 ? '#ff4060' : '#55556a';
    else if (cooling) col = '#5a6a80';
    else if (p.active) col = '#ffe14d';
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = p.active ? 30 : 14;
    ctx.fillStyle = col;
    roundRect(x, y, paddleWidth(), PADDLE_H, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    roundRect(x + 6, y + 3, paddleWidth() - 12, 3, 2); ctx.fill();
    if (p.active && G.mode === 'play') {
      const k = clamp((G.t - p.press) / PARRY_WIN, 0, 1);
      ctx.strokeStyle = `rgba(255,225,77,${1 - k})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(P.x, y + 2, paddleWidth() / 2 + 8 + k * 14, 14 + k * 10, 0, Math.PI, 0); ctx.stroke();
    }
    if (cooling && !stunned) {
      const k = clamp((p.cd - G.t) / PARRY_CD, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(x, y + PADDLE_H + 4, paddleWidth() * k, 2);
    }
    if (stunned) {
      ctx.fillStyle = '#ff4060';
      ctx.fillRect(x, y + PADDLE_H + 4, paddleWidth() * (P.stun / STUN), 2);
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawLasers(t) {
    for (const L of G.lasers) {
      if (L.t < L.warn) {
        const blink = Math.sin(t * 40) > 0;
        ctx.fillStyle = 'rgba(255,40,70,0.08)'; ctx.fillRect(L.x - L.w / 2, TOP_Y, L.w, H - TOP_Y);
        ctx.save();
        ctx.strokeStyle = blink ? 'rgba(255,40,70,0.9)' : 'rgba(255,40,70,0.35)';
        ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
        ctx.beginPath();
        ctx.moveTo(L.x - L.w / 2, TOP_Y); ctx.lineTo(L.x - L.w / 2, H);
        ctx.moveTo(L.x + L.w / 2, TOP_Y); ctx.lineTo(L.x + L.w / 2, H);
        ctx.stroke(); ctx.restore();
        if (blink) text('!', L.x, PADDLE_Y - 40, 22, '#ff4060');
      } else {
        const k = Math.max(0, 1 - (L.t - L.warn) / L.fire);
        const g = ctx.createLinearGradient(L.x - L.w, 0, L.x + L.w, 0);
        g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(0.3, `rgba(255,40,70,${0.6 * k})`);
        g.addColorStop(0.5, `rgba(255,255,255,${k})`);
        g.addColorStop(0.7, `rgba(255,40,70,${0.6 * k})`); g.addColorStop(1, 'rgba(255,40,70,0)');
        ctx.fillStyle = g; ctx.fillRect(L.x - L.w, TOP_Y, L.w * 2, H - TOP_Y);
      }
    }
  }
  function drawRings() {
    for (const r of G.rings) {
      const k = r.t / r.life;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = r.color; ctx.lineWidth = r.wd * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.2 + 0.8 * Math.sqrt(k)), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawParticles() {
    for (const p of G.particles) {
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }
  function drawPopups() {
    for (const p of G.popups) {
      ctx.globalAlpha = 1 - p.t / 0.8;
      text(p.text, p.x, p.y, p.size, p.color);
    }
    ctx.globalAlpha = 1;
  }

  function drawEdgeFx() {
    if (G.mode !== 'play') return;
    const t = performance.now() / 1000;
    const st = G.od ? 4 : stage();
    if (st >= 2) {   // 段階3以上: 画面端が発光
      const c = st === 4 ? '255,77,216' : st === 3 ? '255,180,60' : '77,252,255';
      edgeGlow(c, 0.25 + 0.1 * Math.sin(t * 8), 40);
    }
    if (isDanger()) edgeGlow('255,30,60', 0.35 + 0.35 * Math.abs(Math.sin(t * 7)), 70);
  }
  function edgeGlow(rgb, a, sz) {
    let g = ctx.createLinearGradient(0, 0, sz, 0);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, sz, H);
    g = ctx.createLinearGradient(W, 0, W - sz, 0);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(W - sz, 0, sz, H);
    g = ctx.createLinearGradient(0, H, 0, H - sz);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, H - sz, W, sz);
  }

  function drawHUD() {
    text('SCORE', 20, 14, 18, '#7a74b0', 'left');
    text(fmt(G.dispScore || 0), 20, 38, 32, '#ffffff', 'left', FONT, 900);
    text(G.boss ? 'BOSS ' + (G.boss.idx + 1) : 'WAVE', 400, 14, 18, '#7a74b0');
    text(String(G.wave || 1) + (G.loop ? '  L' + (G.loop + 1) : ''), 400, 38, 30, '#ffffff', 'center', FONT, 900);
    if (G.boss) {
      const tm = Math.ceil(G.boss.time);
      text('TIME', 530, 14, 18, '#7a74b0');
      text(String(tm), 530, 38, 30, tm <= 10 ? '#ff4060' : '#ffffff', 'center', FONT, 900);
    } else {
      text('CHAIN', 530, 14, 18, '#7a74b0');
      text(String(G.streak || 0), 530, 38, 30, '#ffffff', 'center', FONT, 900);
    }
    // ヒート
    const bx = 680, by = 30, bw = 340, bh = 16;
    const st = G.od ? 4 : stage();
    text(G.od ? 'OVERDRIVE ' + Math.max(0, G.odTime).toFixed(1) + 's' : 'HEAT  LV' + (st + 1), bx, 14, 18, G.od ? '#ff4dd8' : '#7a74b0', 'left');
    ctx.fillStyle = '#16132c'; ctx.fillRect(bx, by, bw, bh);
    if (G.od) {
      const k = clamp(G.odTime / OD_MAX, 0, 1);
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#ff4dd8'); g.addColorStop(1, '#ffe14d');
      ctx.fillStyle = g; ctx.fillRect(bx, by, bw * k, bh);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(bx + bw * (OD_TIME / OD_MAX), by - 2, 1, bh + 4);
    } else {
      const k = clamp(G.heat / OD_HEAT, 0, 1);
      const cols = ['#5a6aff', '#4dfcff', '#3dff9b', '#ffb43c'];
      ctx.fillStyle = cols[st]; ctx.fillRect(bx, by, bw * k, bh);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (const m of [100, 250, 450]) ctx.fillRect(bx + bw * m / OD_HEAT, by - 2, 1, bh + 4);
    }
    ctx.strokeStyle = '#2f2a5a'; ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
    const m = mult();
    const mc = ['#ffffff', '#4dfcff', '#3dff9b', '#ffb43c', '#ff4dd8'][st];
    if (m >= 4) glowText('×' + m, W - 16, 34, 34, mc, 14, 'right');
    else text('×' + m, W - 16, 34, 34, mc, 'right', FONT, 900);
    if (G.boss) {
      let hp = 0; for (const b of G.blocks) if (b.type === 'C') hp += Math.max(0, b.hp);
      const w = 360, x = W / 2 - w / 2, y = TOP_Y + 6;
      ctx.fillStyle = '#1a1206'; ctx.fillRect(x, y, w, 6);
      ctx.fillStyle = COL.C; ctx.fillRect(x, y, w * hp / G.boss.maxHp, 6);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x + w * 0.66, y, 1, 6); ctx.fillRect(x + w * 0.33, y, 1, 6);
    }
    if (G.judge && G.mode === 'play') {
      const j = G.judge, s = 1 + Math.max(0, 0.15 - j.t) * 3;
      ctx.globalAlpha = 1 - j.t / 0.6;
      glowText(j.text, G.paddle.x, PADDLE_Y - 36 - j.t * 20, (j.big ? 34 : 28) * s, j.color, 16);
      ctx.globalAlpha = 1;
    }
  }

  function drawCallouts() {
    if (G.mode === 'over') return;
    G.callouts.forEach((c, i) => {
      const a = c.t < 0.1 ? c.t / 0.1 : c.t > c.life - 0.3 ? Math.max(0, (c.life - c.t) / 0.3) : 1;
      const s = c.t < 0.12 ? 1.5 - 0.5 * (c.t / 0.12) : 1;
      const y = 210 + i * 64;
      ctx.globalAlpha = a * 0.92;
      ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
      glowText(c.text, 0, 0, c.size, c.color, 20);
      ctx.restore();
      if (c.sub) text(c.sub, W / 2, y + c.size * 0.8, 16, '#ffffff', 'center', FONT, 900);
      ctx.globalAlpha = 1;
    });
  }

  function drawBanners() {
    const b = G.banner; if (!b || G.mode === 'over') return;
    const a = b.t < 0.15 ? b.t / 0.15 : b.t > 1.4 ? Math.max(0, (1.8 - b.t) / 0.4) : 1;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,4,15,0.55)'; ctx.fillRect(0, 330, W, 90);
    const c = b.od ? '#ff4dd8' : b.text === 'WARNING' || b.text === 'TIME OVER' ? '#ff4060' : '#ffffff';
    glowText(b.text, W / 2, 362, 40, c, 22);
    if (b.sub) text(b.sub, W / 2, 400, 15, '#cfd6ff', 'center', JFONT, 700);
    ctx.globalAlpha = 1;
  }

  function drawClear() {
    const k = Math.min(1, G.clearT / 0.3);
    ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(5,4,15,0.75)'; ctx.fillRect(0, 0, W, H);
    glowText(G.ending ? 'ALL WAVES CLEAR' : G.boss ? 'BOSS DESTROYED' : 'WAVE ' + G.wave + ' CLEAR', W / 2, 220, 36, G.ending ? '#ff4dd8' : '#4dfcff', 24);
    G.bonuses.forEach((b, i) => {
      if (G.clearT < 0.3 + i * 0.18) return;
      const y = 290 + i * 34;
      text(b[0], W / 2 - 220, y, 15, '#cfd6ff', 'left');
      text('+' + fmt(b[1]), W / 2 + 220, y, 17, '#ffe14d', 'right', FONT, 900);
    });
    const y = 290 + G.bonuses.length * 34 + 20;
    if (G.clearT > 0.3 + G.bonuses.length * 0.18) {
      ctx.fillStyle = '#2f2a5a'; ctx.fillRect(W / 2 - 220, y - 14, 440, 1);
      text('SCORE', W / 2 - 220, y + 10, 15, '#7a74b0', 'left');
      text(fmt(G.dispScore), W / 2 + 220, y + 10, 22, '#ffffff', 'right', FONT, 900);
    }
    if (G.ending) text('NEXT LOOP — SPEED KEEPS RISING', W / 2, y + 60, 16, '#ff4dd8', 'center', JFONT);
    ctx.globalAlpha = 1;
  }

  function drawOver() {
    const k = Math.min(1, G.overT / 0.5);
    ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(5,4,15,0.82)'; ctx.fillRect(0, 0, W, H);
    glowText('GAME OVER', W / 2, 130, 68, '#ff4060', 26);
    text(G.overReason, W / 2, 190, 24, '#ff8090');
    const s = G.stats;
    const columns = [
      [['SCORE', G.score], ['WAVE', G.wave], ['MAX CHAIN', G.maxStreak], ['JUST', s.just], ['GRAZE', s.graze]],
      [['BEST SCORE', G.best], ['BEST WAVE', G.bestWave], ['BEST COLLAPSE', s.bestCollapse], ['BEST BLAST', s.bestBlast], ['BEST RICOCHET', s.bestRicochet]]
    ];
    const columnWidth = 440, gap = 60, left = W / 2 - columnWidth - gap / 2;
    columns.forEach((rows, column) => {
      const x = left + column * (columnWidth + gap);
      rows.forEach(([label, value], row) => {
        const y = 278 + row * 54;
        ctx.fillStyle = row % 2 === 0 ? 'rgba(52,43,88,0.35)' : 'rgba(20,28,48,0.35)';
        roundRect(x - 12, y - 24, columnWidth + 24, 48, 8); ctx.fill();
        text(label, x, y, 26, label === 'SCORE' ? '#4dfcff' : '#cfd6ff', 'left');
        const number = fmt(value || 0);
        let size = label === 'SCORE' ? 36 : 30;
        ctx.font = '900 ' + size + 'px ' + FONT;
        const labelWidth = ctx.measureText(label).width;
        const available = Math.max(70, columnWidth - labelWidth - 24);
        ctx.font = '900 ' + size + 'px ' + FONT;
        const measured = ctx.measureText(number).width;
        if (measured > available) size *= available / measured;
        text(number, x + columnWidth, y, size, '#ffffff', 'right', FONT, 900);
      });
    });
    if (G.newBest) glowText('NEW RECORD', W / 2, 230, 26, '#ffe14d', 14);
    if (G.overT > 1.0 && Math.floor(G.overT * 2) % 2 === 0) drawRetryHint(W / 2, 566);
    ctx.globalAlpha = 1;
  }

  function drawRetryHint(x, y) {
    ctx.save(); ctx.font = '700 26px ' + FONT;
    const left = ctx.measureText('TAP').width, right = ctx.measureText('TO RETRY').width;
    const width = left + right + 70;
    const iconX = x - width / 2 + left + 35;
    text('TAP', x - width / 2, y, 26, '#ffffff', 'left');
    text('TO RETRY', iconX + 35, y, 26, '#ffffff', 'left');
    drawActionSymbol(iconX, y);
    ctx.restore();
  }
  function drawActionSymbol(x, y) {
    ctx.save(); ctx.translate(x,y);ctx.strokeStyle='#ffb8ed';ctx.lineWidth=2;ctx.lineCap='round';ctx.shadowColor='#ffb8ed';ctx.shadowBlur=4;
    ctx.beginPath();ctx.moveTo(-12,16);ctx.lineTo(12,16);ctx.moveTo(0,6);ctx.lineTo(0,-16);ctx.lineTo(-9,-7);ctx.moveTo(0,-16);ctx.lineTo(9,-7);ctx.moveTo(-17,6);ctx.quadraticCurveTo(0,23,17,6);ctx.stroke();
    ctx.beginPath();ctx.arc(0,2,3,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  function drawLaunchHint(x, y) {
    // Same arrow, reflection arc and ball as the action button.
    ctx.save(); ctx.translate(x,y); ctx.strokeStyle='#ffb8ed';ctx.lineWidth=2;ctx.lineCap='round';
    text('TAP', -36, 0, 22, '#cfd6ff', 'right');
    
    ctx.beginPath();ctx.moveTo(-12,16);ctx.lineTo(12,16);ctx.moveTo(0,6);ctx.lineTo(0,-16);ctx.lineTo(-9,-7);ctx.moveTo(0,-16);ctx.lineTo(9,-7);ctx.moveTo(-17,6);ctx.quadraticCurveTo(0,23,17,6);ctx.stroke();
    ctx.beginPath();ctx.arc(0,2,3,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  function drawPause() {
    ctx.fillStyle = 'rgba(5,4,15,0.8)'; ctx.fillRect(0, 0, W, H);
    glowText('PAUSED', W / 2, 290, 64, '#4dfcff', 20);
    ctx.save(); ctx.translate(W / 2, 370);
    ctx.font = '700 28px ' + FONT;
    const leftWidth = ctx.measureText(localizedCanvasText('TAP')).width, rightWidth = ctx.measureText(localizedCanvasText('TO RESUME')).width;
    const groupWidth = leftWidth + rightWidth + 60;
    const iconX = -groupWidth / 2 + leftWidth + 30;
    text('TAP', -groupWidth / 2, 0, 28, '#cfd6ff', 'left');
    text('TO RESUME', iconX + 30, 0, 28, '#cfd6ff', 'left');
    ctx.strokeStyle = '#a8ffff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.shadowColor = '#4dfcff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(iconX - 7, -12); ctx.lineTo(iconX - 7, 12);
    ctx.moveTo(iconX + 7, -12); ctx.lineTo(iconX + 7, 12); ctx.stroke(); ctx.restore();
  }

  function drawTitle() { G.titleT += 1 / 60; }

  // =====================================================================
  //  ループ / スケーリング
  // =====================================================================
  function fit() {
    const side = Math.max(80, Math.min(150, innerWidth * 0.13));
    document.documentElement.style.setProperty("--side-width", side + "px");
    const s = Math.min(Math.max(1, innerWidth - side * 2) / W, innerHeight / H);
    cv.style.width = Math.floor(W * s) + 'px';
    cv.style.height = Math.floor(H * s) + 'px';
  }
  addEventListener('resize', fit); fit();

  let last = performance.now(), acc = 0, frameRequest = null;
  function frame(now) {
    frameRequest = null;
    if (G.paused) { render(); return; }
    const rdt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    pollPad(now);
    let scale = 1;
    if (!G.paused) {
      if (G.slowmo > 0) { scale = 0.35; G.slowmo -= rdt; }   // 大崩落・ブレイカー時のスローモーション
      acc += rdt * scale;
      while (acc >= DT) {
        acc -= DT;
        if (G.hitstop > 0) { G.hitstop -= DT; continue; }   // ヒットストップ
        step(DT);
      }
    } else acc = 0;
    SYNC.wall = now; SYNC.sim = G.t + (G.hitstop > 0 ? 0 : acc); SYNC.scale = scale;
    if (!G.paused) G.dispScore += ((G.score || 0) - G.dispScore) * Math.min(1, rdt * 12);
    render();
    if (typeof updateMobileScreens === "function") updateMobileScreens();
    if (!G.paused) frameRequest = requestAnimationFrame(frame);
  }
  frameRequest = requestAnimationFrame(frame);
</script>

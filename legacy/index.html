      <article class="help-card"><div class="help-icon"><svg viewBox="0 0 100 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="50" cy="24" r="17"/><circle cx="50" cy="24" r="7"/><path d="M24 24h9m34 0h9M50 0v7m0 34v7"/></svg></div><h2>タイミング</h2><p>PERFECT → 貫通弾<br>JUST → 衝撃波<br>ヒート上昇でバー拡大（最大1.5倍）</p></article>
      <article class="help-card"><div class="help-icon"><svg viewBox="0 0 100 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="42" y="4" width="16" height="12"/><path d="M50 16v9m-28 0h56M22 25v8m28-8v8m28-8v8"/><path d="M15 38h14m14 0h14m14 0h14"/></svg></div><h2>連鎖</h2><p>白い要石で崩落<br>オレンジの爆薬で誘爆</p></article>
      <article class="help-card"><div class="help-icon"><svg viewBox="0 0 100 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 35h70" stroke="#ff4dd8"/><circle cx="50" cy="12" r="6"/><path d="M50 23v19m0 0-6-6m6 6 6-6"/></svg></div><h2>ゲーム終了</h2><p>最後のボール落下で終了<br>警告線にも注意</p></article>
      <article class="help-card"><div class="help-icon"><svg viewBox="0 0 100 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M40 8v32M60 8v32" stroke-width="7"/></svg></div><h2>一時停止</h2><p>Ⅱで停止・再開</p></article>
    </div></div>
</section>
<button id="return-top" hidden>TOP</button><div id="mobile-controls" hidden><button id="axis-toggle" aria-label="操作バーの向きを切り替え"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 24h32M8 24l8-8m-8 8 8 8M40 24l-8-8m8 8-8 8"/></svg></button><div id="drag-zone" aria-label="左右ドラッグで移動"><div class="drag-rail" aria-hidden="true"><span id="drag-thumb" class="drag-thumb"></span></div></div><div id="action-panel"><button id="pause-button" aria-label="一時停止・再開"><svg viewBox="0 0 100 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M40 8v32M60 8v32" stroke-width="7"/></svg></button><button id="parry-button" aria-label="発射・パリィ"><svg viewBox="0 0 100 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M35 40h30M50 29V5m0 0L38 17m12-12 12 12"/><path d="M29 29q21 16 42 0"/><circle cx="50" cy="24" r="4"/></svg></button></div></div>
<script>


  const languagePairs = [
  ['#start-button','スタート','START'],['#help-button','遊び方','HOW TO PLAY'],['.subtitle','ブロック崩し × パリィ × 弾幕','Brick breaker × Parry × Bullet hell'],['.help-header h1','遊び方','HOW TO PLAY'],['#help-back','戻る','BACK']
  ];
  const helpJapanese = [['移動','画面内・左のバーをドラッグ<br>↔ / ↕ で切り替え'],['発射・パリィ','当たる瞬間にタップ'],['タイミング','PERFECT → 貫通弾<br>JUST → 衝撃波'],['連鎖','白い要石で崩落<br>オレンジの爆薬で誘爆'],['ゲーム終了','最後のボール落下で終了<br>警告線にも注意'],['一時停止','Ⅱで停止・再開']];
  const helpEnglish = [['MOVE','Drag the playfield or left slider<br>Switch with ↔ / ↕'],['LAUNCH / PARRY','Tap as the ball or bullet hits'],['TIMING','PERFECT → Pierce<br>JUST → Shockwave<br>Heat widens paddle (max 1.5×)'],['CHAIN','White keystone → Collapse<br>Orange explosive → Chain blast'],['GAME OVER','Keep at least one ball up<br>Keep blocks above the warning line'],['PAUSE','Tap Ⅱ to pause or resume']];
  function applyLanguage() {
    document.documentElement.lang = uiLanguage;
    for (const [selector,ja,en] of languagePairs) document.querySelector(selector).textContent = uiLanguage === 'ja' ? ja : en;
    const cards = document.querySelectorAll('.help-card');
    (uiLanguage === 'ja' ? helpJapanese : helpEnglish).forEach(([title,body],i) => {
      cards[i].querySelector('h2').textContent = title; cards[i].querySelector('p').innerHTML = body;
    });
    document.getElementById('language-toggle').textContent = uiLanguage === 'ja' ? 'English' : '日本語';
  }
  document.getElementById('language-toggle').addEventListener('click', () => {
    uiLanguage = uiLanguage === 'ja' ? 'en' : 'ja';
    try { localStorage.setItem('ro_language',uiLanguage); } catch (_) {}
    applyLanguage();
  });
  applyLanguage();

    document.getElementById('return-top').addEventListener('click', () => {
    IN.actions.length = 0; toTitle(); updateMobileScreens();
  });
  let controlAxis = storage.get("ro_control_axis", "horizontal");
    let helpVisible = false, lastScreenKey = "", lastRecord = "";
    function updateMobileScreens() {
      const title = G.mode === 'title';
    document.getElementById('return-top').hidden = !(G.paused || G.mode === 'over');
    document.getElementById('pause-button').hidden = G.mode === 'over';
      const thumb = document.getElementById('drag-thumb');
      if (!title) {
        const position = (10 + 80 * clamp((G.paddle.x - paddleWidth() / 2) / (W - paddleWidth()), 0, 1)).toFixed(1) + '%';
        if (controlAxis === "vertical") { thumb.style.left = "50%"; if (thumb.style.top !== position) thumb.style.top = position; }
        else { thumb.style.top = "50%"; if (thumb.style.left !== position) thumb.style.left = position; }
      }
      const screenKey = title + ':' + helpVisible;
      const record = G.best ? 'BEST ' + fmt(G.best) + ' · WAVE ' + G.bestWave : '';
      if (screenKey === lastScreenKey && record === lastRecord) return;
      lastScreenKey = screenKey; lastRecord = record;
      document.getElementById('home-screen').hidden = !title || helpVisible;
      document.getElementById('help-screen').hidden = !title || !helpVisible;
      document.getElementById('mobile-controls').hidden = title;
      if (!title) helpVisible = false;
      document.getElementById('home-record').hidden = !G.best;
    document.getElementById('record-score').textContent = fmt(G.best || 0);
    document.getElementById('record-wave').textContent = 'WAVE ' + (G.bestWave || 0);
    }
    document.getElementById('start-button').addEventListener('click', e => {
      auInit(); IN.actions.push({t:performance.now()});
    });
    document.getElementById('help-button').addEventListener('click', () => { helpVisible = true; updateMobileScreens(); document.getElementById('help-back').focus(); });
    document.getElementById('help-back').addEventListener('click', () => { helpVisible = false; updateMobileScreens(); document.getElementById('help-button').focus(); });
    function updateAxis() {
      document.getElementById('drag-zone').classList.toggle('vertical', controlAxis === 'vertical');
      const toggle = document.getElementById('axis-toggle');
      toggle.classList.toggle('vertical-axis', controlAxis !== 'vertical');
      toggle.setAttribute('aria-label', controlAxis === 'vertical' ? '横操作に切り替え' : '縦操作に切り替え');
    }
    document.getElementById('axis-toggle').addEventListener('pointerdown', e => e.stopPropagation());
    document.getElementById('axis-toggle').addEventListener('click', e => {
      e.stopPropagation(); controlAxis = controlAxis === 'vertical' ? 'horizontal' : 'vertical';
      storage.set('ro_control_axis', controlAxis); updateAxis();
    });
    updateAxis();
    updateMobileScreens();
    let touchPointer = null, lastTouchX = 0, lastTouchY = 0;
    function beginDrag(e) {
      e.preventDefault();
      if (touchPointer !== null) return;
      touchPointer = e.pointerId; lastTouchX = e.clientX; lastTouchY = e.clientY;
      e.currentTarget.setPointerCapture(e.pointerId);
      IN.mouseX = G.paddle.x; IN.useMouse = true; auInit();
    }
    function moveDrag(e) {
      if (e.pointerId !== touchPointer) return;
      e.preventDefault();
      const onRail = e.currentTarget.id === "drag-zone";
      const vertical = onRail && controlAxis === 'vertical';
      const rail = onRail ? e.currentTarget.querySelector('.drag-rail').getBoundingClientRect() : null;
      const travel = onRail ? Math.max(1, (vertical ? rail.height : rail.width) - 20) : cv.getBoundingClientRect().width;
      const scale = onRail ? (W - paddleWidth()) / travel : W / travel;
      const delta = vertical ? e.clientY - lastTouchY : e.clientX - lastTouchX;
      IN.mouseX = clamp(IN.mouseX + delta * scale, paddleWidth() / 2, W - paddleWidth() / 2);
      lastTouchY = e.clientY; lastTouchX = e.clientX; IN.useMouse = true;
    }
    for (const surface of [cv, document.getElementById('drag-zone')]) {
      surface.addEventListener('pointerdown', beginDrag);
      surface.addEventListener('pointermove', moveDrag);
      for (const name of ['pointerup', 'pointercancel', 'lostpointercapture'])
        surface.addEventListener(name, e => { if (e.pointerId === touchPointer) touchPointer = null; });
    }
    for (const name of ['mousedown', 'mousemove'])
      cv.addEventListener(name, e => { e.preventDefault(); e.stopImmediatePropagation(); }, true);
    document.getElementById('parry-button').addEventListener('pointerdown', e => {
      e.preventDefault(); auInit(); IN.actions.push({ t: e.timeStamp });
    });
    document.getElementById('pause-button').addEventListener('pointerdown', e => {
      e.preventDefault(); togglePause();
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
</script>
</body>
</html>

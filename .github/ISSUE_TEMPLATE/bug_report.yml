name: 不具合の報告
description: 動作がおかしい、落ちる、表示が崩れるなどの不具合を報告する
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不具合の報告ありがとうございます。再現できる情報があるほど早く直せます。

        起票したあと `@claude` を付けてコメントすると、Claude がこの Issue をもとに修正し、Android エミュレーターで確かめてから PR を作ります。人は PR のレビューの所見と確かめた結果を見て Approve するだけなので、**「本来どうなるべきか」と「完了条件」は 1 つに決めて** 書いてください。決めきれないことは「決めていないこと」に書きます。

  - type: textarea
    id: summary
    attributes:
      label: 何が起きたか
      description: 起きたことを簡潔に書いてください。
      placeholder: 例) ボス戦でボールが壁をすり抜けて画面外に消えた
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 同じことを起こすための手順を書いてください。わからない場合は「不明」で構いません。
      placeholder: |
        1. ステージモードで第2章の 3 を選ぶ
        2. FEVER TIME 中にボールをパリィする
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 本来どうなるべきか
      description: 直したあとの正しい動きを 1 つに決めて書いてください。案が複数あるなら、選んだものだけを書きます。
      placeholder: 例) ボールが壁で跳ね返る
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 直ったと言える条件を、確かめられる形で箇条書きにしてください。修正の PR はこれを満たすように作り、レビューもこれで確かめます。「○○したとき△△が表示される」のように画面で確かめられる形だと、Claude がエミュレーターで確かめます。
      placeholder: |
        - [ ] FEVER TIME 中にパリィしたボールが、左右の壁で跳ね返る
        - [ ] 同じ状況を再現する単体テストがある
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: 決めていないこと
      description: 直し方で迷っていることがあれば書き、それぞれ「任せる」(Claude が決めて PR の本文に書く)か「先に聞いてほしい」(着手する前に Issue で質問する)かを添えてください。なければ空欄で構いません。
      placeholder: |
        - すり抜けたボールを戻すか、その場でミスにするか → 先に聞いてほしい
        - テストの置き場所 → 任せる
    validations:
      required: false

  - type: textarea
    id: code
    attributes:
      label: 関係しそうなコード
      description: 原因の見当がついていれば、ファイル・関数・設定値を書いてください。わからなければ空欄で構いません。
      placeholder: 例) app/lib/core/ の壁との当たり判定、app/lib/core/config/tuning.dart の速度の上限
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: 起きた場面
      options:
        - ステージモード
        - エンドレス
        - タイトル・メニュー・設定
        - ランキング・記録
        - その他
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 発生頻度
      options:
        - 毎回起きる
        - ときどき起きる
        - 一度だけ起きた
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: OS
      options:
        - iOS
        - Android
        - 両方
        - その他 (シミュレータ・エミュレータなど)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 端末と OS のバージョン
      placeholder: 例) iPhone 15 / iOS 18.1
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: アプリのバージョン
      description: タイトル画面の右下に表示されています。
      placeholder: 例) 1.0.0
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: スクリーンショット・動画・ログ
      description: あれば貼り付けてください。画像や動画はドラッグ&ドロップで添付できます。Claude は動画を見られないので、動画でわかることは再現手順にも文章で書いてください。
    validations:
      required: false

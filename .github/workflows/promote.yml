# テスト配信で確認したビルドを本番に出す。最新のタグ (GitHub Release) のビルドを使う。手順は docs/release-flow.md。
#   iOS: 審査に提出する (承認後に段階的リリース)
#   Android: 内部テストのビルドを本番に昇格し、全員に公開する
name: promote

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, ios, android]
        default: both
      build_number:
        description: 出すビルド番号 (空なら最新の release の実行のもの)
        required: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_BUILD" ]; then
            build="$INPUT_BUILD"
          else
            # GitHub Release の本文の「ビルド番号: N」から読む
            build=$(gh release view "$tag" --json body -q .body | sed -n 's/^ビルド番号: *//p')
          fi
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "$tag / ビルド $build"

  ios:
    needs: resolve
    if: inputs.platform != 'android'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.resolve.outputs.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: >-
          bundle exec fastlane submit
          version:${{ needs.resolve.outputs.version }}
          build_number:${{ needs.resolve.outputs.build_number }}

  android:
    needs: resolve
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.resolve.outputs.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app
      - env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          bundle exec fastlane promote
          version_code:${{ needs.resolve.outputs.build_number }}

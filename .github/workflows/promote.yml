# テスト配信で確認したビルドを本番に出す。最新のタグ (GitHub Release) のビルドを使う。手順は docs/release-flow.md。
#   iOS: 審査に提出する (承認後に段階的リリース)
#   Android: 内部テストのビルドを本番に昇格し、全員に公開する
name: promote

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, ios, android]
        default: both
      build_number:
        description: 出すビルド番号 (空なら最新の release の実行のもの)
        required: false

# GITHUB_TOKEN は既定で読み取りだけにする。書き込みが要るジョブは、ジョブの permissions で広げる
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILD: ${{ inputs.build_number }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "::error::v で始まるタグがない。release.yml でリリースしてから実行し直す"
            exit 1
          fi
          if [ -n "$INPUT_BUILD" ]; then
            build="$INPUT_BUILD"
            from="入力 (build_number)"
          else
            # GitHub Release の本文の「ビルド番号: N」から読む (Web で直した本文は改行が CRLF になるので \r を落とす)
            build=$(gh release view "$tag" --json body -q .body | tr -d '\r' | sed -n 's/^ビルド番号: *//p' | head -n1)
            from="GitHub Release $tag の本文"
          fi
          build=$(printf '%s' "$build" | tr -d '[:space:]')
          # 空や数字でない番号のまま fastlane に渡すと、Android は 0 を昇格しようとして分かりにくく失敗する。ストアには何も送らずに止める
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then
            if [ -n "$INPUT_BUILD" ]; then
              echo "::error::入力の build_number が数字でない ('${build}')。数字を入力して実行し直す"
            else
              echo "::error::GitHub Release ($tag) の本文にビルド番号がない ('ビルド番号: N' の行が読めない)。build_number を入力して実行し直す"
            fi
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "$tag / ビルド $build"
          # 何を出すかを、実行の画面 (Summary) で見られるようにする
          {
            echo "## 本番に出すビルド"
            echo
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| タグ | \`$tag\` |"
            echo "| バージョン名 | ${tag#v} |"
            echo "| ビルド番号 | $build ($from) |"
            echo "| 対象の OS | $PLATFORM |"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: resolve
    if: inputs.platform != 'android'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.resolve.outputs.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: >-
          bundle exec fastlane submit
          version:${{ needs.resolve.outputs.version }}
          build_number:${{ needs.resolve.outputs.build_number }}

  android:
    needs: resolve
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.resolve.outputs.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          bundle exec fastlane promote
          version_code:${{ needs.resolve.outputs.build_number }}

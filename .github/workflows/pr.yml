# PR ごとに、チェックと Claude のレビューを行う。
# dev 向けの PR は、両方が通り、hold / needs-fix のラベルがなければ自動でマージする。
# main 向けの PR (リリース PR・ホットフィックス) は自動ではマージしない。手順は docs/release-flow.md。
name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  review:
    # フォークからの PR ではシークレットが使えないので動かさない
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # main 向けの PR で、前回のタグからの変更を見るため
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 観点・重さの基準・ラベルの付け方は .claude/skills/pr-review/SKILL.md に書く
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            pr-review スキル(.claude/skills/pr-review/SKILL.md)の手順で、この PR をレビューする。
            指摘は日本語のインラインコメントで書き、最後に全体の所見をコメントし、needs-fix ラベルを付け外しする。
          claude_args: >-
            --allowedTools "Skill,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(git log:*),Bash(git diff:*),Bash(git tag:*),Bash(wc:*)"

  automerge:
    needs: [check, review]
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ラベルはレビューの後に付くので、イベントの中身ではなくいまの状態を読む
          labels=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name] | join(" ")')
          if grep -qwE 'hold|needs-fix' <<<"$labels"; then
            echo "::notice::ラベル ($labels) が付いているので、自動ではマージしない"
            exit 0
          fi
          # レビューの後に push されていたらマージしない (その push の実行に任せる)
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"

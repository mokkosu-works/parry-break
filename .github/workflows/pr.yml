# PR ごとに、チェック・エミュレーターでのテスト・Claude のレビューを行う。
# dev 向けの PR は、すべて通って人が Approve していれば (順番はどちらが先でもよい)、squash でマージする。
# 人の Approve を受けてマージするのは merge.yml。条件は .github/scripts/merge-if-approved.sh。
# main 向けの PR (リリース PR・ホットフィックス) は人が手でマージする。手順は docs/release-flow.md。
name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Android エミュレーターでアプリを動かし、起動から一通りの画面を通って落ちないことを確かめる
  e2e:
    # 15 分ほどかかるので、下書きでは動かさない (ready_for_review で動く)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-emulator
      - name: スモークテスト
        working-directory: app
        timeout-minutes: 15
        run: >-
          SHOT_DIR=build/smoke flutter drive -d emulator-5554
          --driver=test_driver/integration_test.dart --target=integration_test/smoke_test.dart
      - if: always()
        run: |
          # 端末がないと adb logcat は待ち続けるので、上限を付ける。エミュレーター自体のログも残す
          mkdir -p app/build
          timeout 60 adb logcat -d > app/build/logcat.txt || true
          cp "$RUNNER_TEMP/emulator.log" app/build/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            app/build/smoke/
            app/build/logcat.txt
            app/build/emulator.log
          if-no-files-found: ignore

  review:
    # フォークからの PR ではシークレットが使えないので動かさない
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # main 向けの PR で、前回のタグからの変更を見るため
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Issue から実装した PR は Claude の GitHub アプリ (claude[bot]) が作るので、それも通す
          allowed_bots: claude
          # 観点・重さの基準・ラベルの付け方は .claude/skills/pr-review/SKILL.md に書く
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            pr-review スキル(.claude/skills/pr-review/SKILL.md)の手順で、この PR をレビューする。
            指摘は日本語のインラインコメントで書き、最後に全体の所見をコメントし、needs-fix ラベルを付け外しする。
          claude_args: >-
            --allowedTools "Skill,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git tag:*),Bash(wc:*)"

  merge:
    needs: [check, e2e, review]
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # スクリプトは PR の側ではなく、dev にあるものを使う (PR で条件を緩められないように)
          ref: dev
      # 人がもう Approve していればマージする。まだなら何もしない (Approve されたときに merge.yml がマージする)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/merge-if-approved.sh ${{ github.event.pull_request.number }}

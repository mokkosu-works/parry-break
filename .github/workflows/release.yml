# main に入ったら、両 OS をビルドしてテスト配信する。
# Android: Play の内部テスト / iOS: TestFlight。成功したらタグ v<バージョン名> と GitHub Release を作る。
# バージョン名のタグがすでにあれば (= バージョンを上げていなければ) 何もしない。
# OS ごとに、リポジトリの変数 IOS_RELEASE / ANDROID_RELEASE が true のときだけ動く。
# 手動実行で dry_run を選ぶと、ビルドと署名だけを試す (ストアに上げない・タグを付けない・変数とタグを見ない)。
# 手順は docs/release-flow.md。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # 失敗したリリースをやり直すとき (ブランチは main を選ぶ)、署名の設定を試すとき
    inputs:
      dry_run:
        description: ビルドと署名だけ試す (ストアに上げない・タグを付けない)
        type: boolean
        default: false
      platform:
        description: dry_run で試す OS
        type: choice
        options: [ios, android, both]
        default: ios

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
      skip: ${{ steps.v.outputs.skip }}
      ios: ${{ steps.v.outputs.ios }}
      android: ${{ steps.v.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          PLATFORM: ${{ inputs.platform }}
          IOS_RELEASE: ${{ vars.IOS_RELEASE }}
          ANDROID_RELEASE: ${{ vars.ANDROID_RELEASE }}
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # ストアのビルド番号。iOS と Android で同じ番号にする (手で上げた 1〜99 と重ならないよう +100)
          echo "build_number=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::dry_run: $PLATFORM のビルドと署名だけを試す"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            [ "$PLATFORM" != android ] && ios=true || ios=false
            [ "$PLATFORM" != ios ] && android=true || android=false
            echo "ios=$ios" >> "$GITHUB_OUTPUT"
            echo "android=$android" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ios=${IOS_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "android=${ANDROID_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version は出しているので、何もしない。出すときは app/pubspec.yaml のバージョン名を上げる"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$IOS_RELEASE" != true ] && [ "$ANDROID_RELEASE" != true ]; then
            echo "::notice::変数 IOS_RELEASE / ANDROID_RELEASE がどちらも true でないので、何もしない"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    uses: ./.github/workflows/check.yml

  android:
    needs: [prepare, check]
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: アップロード鍵を置く
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: >-
          flutter build appbundle --release
          --build-name=${{ needs.prepare.outputs.version }}
          --build-number=${{ needs.prepare.outputs.build_number }}
      - name: Play の内部テストに上げる
        if: inputs.dry_run != true
        working-directory: app/android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane internal
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

  ios:
    needs: [prepare, check]
    if: needs.prepare.outputs.ios == 'true'
    # App Store には最新の Xcode でビルドしたものしか上げられないので、新しいイメージを使う
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: flutter pub get
      # Flutter の成果物と依存を用意する。署名とアーカイブは fastlane が行う
      - run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.prepare.outputs.version }}
          --build-number=${{ needs.prepare.outputs.build_number }}
      - name: 署名してアーカイブし、TestFlight に上げる (dry_run では上げない)
        working-directory: app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta upload:${{ inputs.dry_run != true }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/build/ios/ipa/*.ipa

  publish:
    needs: [prepare, android, ios]
    # 動かした OS がすべて成功したときだけ。止めている OS (skipped) は問わない
    if: >-
      always() &&
      inputs.dry_run != true &&
      needs.prepare.outputs.skip == 'false' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: タグと GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build_number }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          platforms=""
          [ "$IOS" = success ] && platforms="$platforms iOS(TestFlight)"
          [ "$ANDROID" = success ] && platforms="$platforms Android(内部テスト)"
          {
            cat app/ios/fastlane/metadata/ja/release_notes.txt
            echo
            echo "---"
            # promote.yml がこの行を読む。書式を変えない
            echo "ビルド番号: $BUILD"
            echo "配信先:$platforms"
          } > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md

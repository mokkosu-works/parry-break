# 静的解析とテスト。pr.yml と release.yml から呼ぶ。
name: check

on:
  workflow_call:

# GITHUB_TOKEN は既定で読み取りだけにする。書き込みが要るジョブは、ジョブの permissions で広げる
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 版は app/pubspec.yaml の environment.flutter で決める
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

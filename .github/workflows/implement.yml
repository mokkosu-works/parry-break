# Issue のコメントで @claude と書くと、Claude がその Issue を実装し、Android エミュレーターで確かめてから dev 向けの PR を作る。
# 手順と PR の書き方は .claude/skills/implement-issue/SKILL.md に書く。
# PR は Claude の GitHub アプリ (claude[bot]) が作るので、pr.yml (チェック・レビュー) がそのまま動く (e2e は main 向けの PR だけ)。マージは人が Approve してから。
# 同じ Issue でもう一度 @claude と書くと (質問への回答など)、同じブランチ・同じ PR で続きをする。
# Claude がブランチに変更を残したのに PR を作らずに終わったときは、ワークフローが下書きの PR を作る。
name: implement

on:
  issue_comment:
    types: [created]

# GITHUB_TOKEN は既定で読み取りだけにする。書き込みが要るジョブは、ジョブの permissions で広げる
permissions:
  contents: read

concurrency:
  group: implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: claude/issue-${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 着手したことを Issue に書く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ジョブの開始時刻 (Claude に渡す時間を決めるのに使う)
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "着手しました。実装して Android エミュレーターで確かめてから PR を作ります。([進み具合]($RUN_URL))"

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: 作業ブランチに切り替える (前回の続きなら、そのブランチ)
        run: |
          if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null; then
            git switch -c "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi

      - uses: ./.github/actions/android-emulator

      # Claude の作業には、ジョブの上限 (timeout-minutes) から、ここまでにかかった時間とあとの片付けの分 (RESERVE) を引いた時間を渡す。
      # ジョブの上限で止まると結果が cancelled になり、あとのステップ (下書きの PR・失敗のコメント) が動かないので、
      # Claude のステップの上限で先に止めて failure にする。ジョブの上限を変えるときは JOB_MINUTES も変える
      - name: Claude に渡す時間を決める
        id: budget
        env:
          JOB_MINUTES: 120
          RESERVE: 10
        run: |
          elapsed=$(( ($(date +%s) - ${JOB_STARTED:-$(date +%s)}) / 60 ))
          minutes=$(( JOB_MINUTES - RESERVE - elapsed ))
          [ "$minutes" -ge 10 ] || minutes=10
          echo "ジョブの開始から $elapsed 分。Claude には $minutes 分を渡す"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "CLAUDE_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - id: claude
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          # flutter drive の撮った画面の置き場所 (test_driver/integration_test.dart が読む)
          SHOT_DIR: ${{ github.workspace }}/app/build/claude
          # ビルドとエミュレーターでのテストは数分かかる
          BASH_DEFAULT_TIMEOUT_MS: '900000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            BRANCH: ${{ env.BRANCH }} (チェックアウト済み。dev から切ってある)
            RUN URL: ${{ env.RUN_URL }}
            DEVICE: emulator-5554 (Android エミュレーター。起動済みで、アプリのデバッグビルドも済んでいる)
            SHOT_DIR: ${{ github.workspace }}/app/build/claude

            implement-issue スキル(.claude/skills/implement-issue/SKILL.md)の手順で、この Issue を実装し、
            エミュレーターで確かめてから dev 向けの PR を作る(すでに PR があればそこに push する)。
          # dev / main への push、ラベルの付け外し、マージに使えるコマンドは許さない。
          # git はサブコマンドごとに許し、push は作業ブランチへの決まった形だけ (末尾に :* を付けず、完全一致にする)。
          # gh pr edit は、いまのブランチの PR の本文を差し替える決まった形だけ (--add-label / --remove-label を付けられない)。
          # 長いコマンドは BASH_DEFAULT_TIMEOUT_MS に任せ、timeout や find -exec で包む形は許さない (ファイルは Glob で探す)
          claude_args: >-
            --max-turns 300
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,TodoWrite,Bash(flutter:*),Bash(dart:*),Bash(adb:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git restore:*),Bash(git checkout --:*),Bash(git rev-parse:*),Bash(git fetch:*),Bash(git stash:*),Bash(git rm:*),Bash(git mv:*),Bash(git push -u origin ${{ env.BRANCH }}),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr edit --body-file app/build/pr_body.md),Bash(gh pr ready:*),Bash(gh pr comment:*),Bash(cd:*),Bash(ls:*),Bash(mkdir:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(wc:*),Bash(sed -n:*)"

      # Claude のステップにかかった時間を残す (失敗のコメントで、時間切れかを見分ける)
      - name: Claude にかかった時間を残す
        if: always() && env.CLAUDE_STARTED != ''
        run: echo "CLAUDE_SECONDS=$(( $(date +%s) - CLAUDE_STARTED ))" >> "$GITHUB_ENV"

      # Claude が途中で止まった・PR を作り忘れたときも、やったことが PR として残るようにする。
      # Claude の GitHub アプリのトークンで作るので、Approve できるのは「準備完了」にしたあと pr.yml が通ってから
      - name: PR がなければ下書きで作る
        if: always() && steps.claude.outputs.github_token != ''
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token }}
        run: |
          echo "::add-mask::$GH_TOKEN"
          repo="$GITHUB_REPOSITORY"
          # コミットしたが push していなければ push する (コミットしていない変更は残さない)
          if git rev-parse -q --verify "refs/heads/$BRANCH" >/dev/null; then
            unpushed=$(git rev-list "origin/$BRANCH..$BRANCH" 2>/dev/null || git rev-list "origin/dev..$BRANCH")
            if [ -n "$unpushed" ]; then
              git push "https://x-access-token:$GH_TOKEN@github.com/$repo.git" "$BRANCH:$BRANCH"
            fi
          fi
          if ! gh api "repos/$repo/branches/$BRANCH" >/dev/null 2>&1; then
            echo "ブランチがない (実装していない。質問だけで終えたなど)"
            exit 0
          fi
          ahead=$(gh api "repos/$repo/compare/dev...$BRANCH" -q .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "dev からの変更がない"
            exit 0
          fi
          pr=$(gh pr list -R "$repo" --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$pr" ]; then
            echo "PR がある: $pr"
            exit 0
          fi
          title=$(gh issue view "$ISSUE" -R "$repo" --json title -q .title)
          body=$(printf '%s\n' \
            "**Claude が PR を作らずに終わったので、ワークフローが下書きで作りました。** 動作の確認が済んでいるかわかりません。" \
            "続けさせるなら Issue に \`@claude\` とコメントし、このまま進めるなら差分を確かめて「準備完了」にしてください。" \
            "" \
            "Closes #$ISSUE" \
            "" \
            "実行のログと撮った画面: $RUN_URL")
          pr=$(gh pr create -R "$repo" --draft --base dev --head "$BRANCH" --title "$title" --body "$body")
          gh issue comment "$ISSUE" -R "$repo" --body "Claude が PR を作らずに終わったので、下書きの PR を作りました: $pr"

      - name: logcat を残す
        if: always()
        run: |
          # 端末がないと adb logcat は待ち続けるので、上限を付ける。エミュレーター自体のログも残す
          mkdir -p app/build
          timeout 60 adb logcat -d > app/build/claude-logcat.txt || true
          cp "$RUNNER_TEMP/emulator.log" app/build/ 2>/dev/null || true

      # PR の本文からリンクする (Claude が「確かめたこと」に、この実行の URL を書く)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            app/build/claude/
            app/build/claude-logcat.txt
            app/build/emulator.log
          if-no-files-found: ignore

      # 手で Cancel したとき (cancelled) は書かない。時間切れは Claude のステップの上限で failure になるので、ここで書く
      - name: 失敗したことを Issue に書く
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_MINUTES: ${{ steps.budget.outputs.minutes }}
        run: |
          retry="もう一度 \`@claude\` と書くと、続きからやり直します。"
          # 上限で止められたステップも failure になるので、かかった時間で見分ける
          if [ "$CLAUDE_OUTCOME" = failure ] && [ -n "$CLAUDE_SECONDS" ] && [ -n "$CLAUDE_MINUTES" ] &&
             [ "$CLAUDE_SECONDS" -ge $(( CLAUDE_MINUTES * 60 - 30 )) ]; then
            body="時間切れ(Claude の作業の上限 $CLAUDE_MINUTES 分)で途中で止まりました。[ログ]($RUN_URL) を確かめてください。コミット済みの変更は下書きの PR に残っていることがあります。$retry"
          else
            body="途中で失敗しました。[ログ]($RUN_URL) を確かめてください。$retry"
          fi
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$body"

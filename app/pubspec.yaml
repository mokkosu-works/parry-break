name: parry_break
description: "PARRY BREAK — ブロック崩し × パリィ × 弾幕"
# pub.dev に公開しない
publish_to: 'none'

# バージョン名+ビルド番号。上げ方は docs/release-flow.md の「バージョン名の上げ方」。+N は CI が上書きする
version: 1.5.1+12

environment:
  sdk: ^3.13.5
  # 使う Flutter の版。CI (check / e2e / fix / release) は subosito/flutter-action の flutter-version-file でここを読む。
  # 上げるときはここだけを変える (pubspec.lock も flutter pub get で更新する)
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter

  flutter_soloud: ^5.1.6
  shared_preferences: ^2.5.5
  games_services: ^5.3.0
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.7
  package_info_plus: ^10.2.2
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/stages/

  fonts:
    # 英数字のドット文字
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700
    # 日本語のドット文字 (使っている文字だけ。tools/subset_jp_font.sh で作る)
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-subset.ttf


# アイコン: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: branding/icons/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#07060A"
  adaptive_icon_foreground: branding/icons/icon-maskable-512.png
  web:
    generate: true
    image_path: branding/icons/icon-512.png
    background_color: "#07060A"
    theme_color: "#07060A"

# 起動画面: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#07060A"
  image: branding/icons/icon-512.png
  android_12:
    color: "#07060A"
    image: branding/icons/icon-512.png
  fullscreen: true
  web: false
